<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Barlow+Semi+Condensed:wght@500;600&display=swap">
<style>
/* Layout: a client's own video shelf — summary strip, search/filter bar, then one section per month (newest first) with a row per video. */
:root{
  --bg:#f6f5f1; --surface:#ffffff; --sunk:#efeee8; --ink:#1d2a38; --muted:#5d6874; --line:#dedcd3;
  --accent:#22405f; --accent-ink:#ffffff; --done:#1f7a52; --wait:#a86a00; --wip:#3b6aa0;
  --font:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --num:"Barlow Semi Condensed","Zen Kaku Gothic New",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171d; --surface:#1a2129; --sunk:#151b22; --ink:#e7ebef; --muted:#9aa6b2; --line:#2b3540;
  --accent:#9cc0e4; --accent-ink:#12171d; --done:#4cc28c; --wait:#e2b44a; --wip:#7fb0e6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --surface:#1a2129; --sunk:#151b22; --ink:#e7ebef; --muted:#9aa6b2; --line:#2b3540;
  --accent:#9cc0e4; --accent-ink:#12171d; --done:#4cc28c; --wait:#e2b44a; --wip:#7fb0e6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.6}
.wrap{max-width:980px;margin:0 auto;padding-block:28px 64px;padding-inline:16px;display:grid;gap:22px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
header{display:grid;gap:4px;border-bottom:2px solid var(--accent);padding-bottom:14px}
header .eyebrow{font-size:12px;letter-spacing:.14em;color:var(--muted)}
header h1{margin:0;font-size:26px;text-wrap:balance}
header .upd{font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:2px}
.tile .l{font-size:12px;color:var(--muted)}
.tile .v{font-family:var(--num);font-size:30px;font-weight:600;line-height:1.1}
.tile .v small{font-size:14px;color:var(--muted);font-weight:500}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar input,.bar select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
.bar input{flex:1 1 220px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.month{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.month summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 16px;background:var(--sunk)}
.month summary::-webkit-details-marker{display:none}
.month summary h2{margin:0;font-size:17px}
.month summary .cnt{font-size:13px;color:var(--muted)}
.month summary .cnt b{font-family:var(--num);font-size:20px;color:var(--ink)}
.month summary::after{content:"▾";color:var(--muted);margin-left:8px}
.month:not([open]) summary::after{content:"▸"}
.row{display:grid;grid-template-columns:88px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.row .d{font-family:var(--num);font-size:15px}
.row .d small{display:block;font-size:11px;color:var(--muted);font-family:var(--font)}
.row .t{min-width:0}
.row .t b{display:block;overflow-wrap:anywhere}
.st{display:inline-block;font-size:11px;font-weight:700;border:1px solid currentColor;border-radius:999px;padding:0 8px;margin-top:3px}
.st.done{color:var(--done)} .st.wait{color:var(--wait)} .st.wip{color:var(--wip)}
.links{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.links a{font-size:12px;font-weight:700;text-decoration:none;color:var(--accent-ink);background:var(--accent);border-radius:8px;padding:6px 10px;white-space:nowrap}
.links a.sub{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.links .none{font-size:12px;color:var(--muted)}
@media (max-width:560px){.row{grid-template-columns:64px minmax(0,1fr)}.links{grid-column:1/-1;justify-content:flex-start}}
.sns{display:grid;gap:10px}
.sns h2{font-size:17px;margin:0}
.sns table{width:100%;border-collapse:collapse;font-size:13px}
.sns th,.sns td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.sns th{font-size:11px;color:var(--muted);font-weight:500;background:var(--sunk)}
.sns td.r,.sns th.r{text-align:right}
.sns td.w{white-space:normal;min-width:160px}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}
footer{font-size:12px;color:var(--muted)}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">VIDEO LIBRARY</div>
    <h1 id="ttl"></h1>
    <div class="upd" id="upd"></div>
  </header>
  <section class="tiles" id="tiles" aria-label="概要"></section>
  <div class="bar">
    <input id="q" type="search" placeholder="動画名で探す（例：コーティング）" aria-label="動画名で検索">
    <select id="m" aria-label="月で絞り込む"></select>
    <div class="chips" role="group" aria-label="状態で絞り込む">
      <button class="chip" data-st="" aria-pressed="true">すべて</button>
      <button class="chip" data-st="done" aria-pressed="false">完成</button>
      <button class="chip" data-st="wait" aria-pressed="false">確認待ち</button>
      <button class="chip" data-st="wip" aria-pressed="false">制作中</button>
    </div>
  </div>
  <main id="list"></main>
  <section class="sns" id="sns" hidden></section>
  <footer>動画のリンクはGoogleドライブ等の共有リンクです。開けない場合は担当者までご連絡ください。</footer>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
const D=JSON.parse(document.getElementById('data').textContent);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const W='日月火水木金土';
const dl=d=>{if(!d)return'';const [y,m,dd]=d.split('-').map(Number);return m+'/'+dd+'<small>'+W[new Date(y,m-1,dd).getDay()]+'曜日</small>'};
const ml=m=>{const [y,mo]=m.split('-');return y+'年'+Number(mo)+'月'};
const ST={done:'完成',wait:'確認待ち',wip:'制作中'};
const fmt=n=>typeof n==='number'?n.toLocaleString('ja-JP'):'—';
document.getElementById('ttl').textContent=D.client+' 様';
document.getElementById('upd').textContent='制作した動画の一覧 ・ '+D.updated+' 時点';
document.title=D.client+' 動画ライブラリ';
const months=[...new Set(D.videos.map(v=>v.month))].sort().reverse();
const sel=document.getElementById('m');
sel.innerHTML='<option value="">すべての月</option>'+months.map(m=>'<option value="'+m+'">'+ml(m)+'（'+D.videos.filter(v=>v.month===m).length+'本）</option>').join('');
const nowM=D.updated.slice(0,7).replace('/','-');
const thisMonth=D.videos.filter(v=>v.month===nowM).length;
document.getElementById('tiles').innerHTML=
  '<div class="tile"><span class="l">これまでの制作本数</span><span class="v">'+D.videos.length+'<small> 本</small></span></div>'
 +'<div class="tile"><span class="l">今月（'+Number(nowM.slice(5))+'月）の本数</span><span class="v">'+thisMonth+'<small> 本</small></span></div>'
 +'<div class="tile"><span class="l">完成した動画</span><span class="v">'+D.videos.filter(v=>v.st==='done').length+'<small> 本</small></span></div>'
 +'<div class="tile"><span class="l">次の投稿予定</span><span class="v" style="font-size:22px">'+(()=>{const n=D.videos.filter(v=>v.date&&v.date>=D.today).sort((a,b)=>a.date.localeCompare(b.date))[0];return n?n.date.slice(5).replace('-','/'):'—'})()+'</span></div>';
let stF='';
function render(){
  const q=document.getElementById('q').value.trim().toLowerCase(),mF=sel.value;
  const vs=D.videos.filter(v=>(!q||v.title.toLowerCase().includes(q))&&(!mF||v.month===mF)&&(!stF||v.st===stF));
  const list=document.getElementById('list');
  if(!vs.length){list.innerHTML='<div class="empty">条件に合う動画はありません。</div>';return}
  const ms=[...new Set(vs.map(v=>v.month))].sort().reverse();
  list.innerHTML=ms.map((m,i)=>{const rows=vs.filter(v=>v.month===m).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    return'<details class="month"'+(i<3||q||mF?' open':'')+'><summary><h2>'+ml(m)+'</h2><span class="cnt"><b>'+rows.length+'</b> 本</span></summary>'
      +rows.map(v=>'<div class="row"><div class="d">'+(v.date?dl(v.date):'<small>投稿日未定</small>')+'</div><div class="t"><b>'+esc(v.title)+'</b><span class="st '+v.st+'">'+ST[v.st]+'</span></div><div class="links">'
        +(v.links.length?v.links.map((l,j)=>'<a'+(j?' class="sub"':'')+' href="'+esc(l.u)+'" target="_blank" rel="noopener">'+esc(l.k)+'</a>').join(''):'<span class="none">リンク準備中</span>')+'</div></div>').join('')+'</details>'}).join('<div style="height:12px"></div>');
}
document.getElementById('q').addEventListener('input',render);
sel.addEventListener('change',render);
document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{stF=b.dataset.st;document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()}));
render();
if(D.sns&&D.sns.length){
  const el=document.getElementById('sns');el.hidden=false;
  const P={ig:'Instagram',tt:'TikTok',yts:'YouTube ショート',ytl:'YouTube'};
  el.innerHTML='<h2>SNSに投稿された動画と再生数</h2><div class="scroll"><table><thead><tr><th>投稿日</th><th>媒体</th><th>動画</th><th class="r">再生</th><th class="r">いいね</th></tr></thead><tbody>'
    +D.sns.map(v=>'<tr><td class="num">'+v.date.slice(5).replace('-','/')+'</td><td>'+P[v.p]+'</td><td class="w">'+(v.url?'<a href="'+esc(v.url)+'" target="_blank" rel="noopener">'+esc(v.title||'(無題)')+'</a>':esc(v.title||'(無題)'))+'</td><td class="r num">'+fmt(v.views)+'</td><td class="r num">'+fmt(v.likes)+'</td></tr>').join('')
    +'</tbody></table></div><p style="margin:0;font-size:12px;color:var(--muted)">再生数・いいねは '+esc(D.snsAt)+' 時点の数字です。</p>';
}
})();
</script>
