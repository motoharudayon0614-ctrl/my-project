:root{

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171d; --surface:#1a2129; --sunk:#151b22; --ink:#e7ebef; --muted:#9aa6b2; --line:#2b3540;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.6}
.wrap{max-width:980px;margin:0 auto;padding-block:28px 64px;padding-inline:16px;display:grid;gap:22px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

header .eyebrow{font-size:12px;letter-spacing:.14em;color:var(--muted)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:2px}

.month:not([open]) summary::after{content:"▸"}
.row{display:grid;grid-template-columns:minmax(0,1fr) 300px 200px;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dt{display:grid;gap:1px;padding:6px 10px;border-radius:8px;background:var(--sunk)}

.row .t{min-width:0}
.row .t b{display:block;overflow-wrap:anywhere}

.sns table{width:100%;border-collapse:collapse;font-size:13px}

.sns td.w{white-space:normal;min-width:160px}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}
footer{font-size:12px;color:var(--muted)}

@page{size:A4;margin:12mm 10mm}
@media print{
  :root,:root:not([data-theme="light"]){--bg:#fff;--surface:#fff;--sunk:#f1f3f6;--ink:#1d2a38;--muted:#5d6874;--line:#d9dde3;--accent:#22405f;--accent-ink:#fff;--done:#1f7a52;--wait:#a86a00;--wip:#3b6aa0;color-scheme:light}
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:12px}
  .wrap{max-width:none;padding:0;gap:14px}
  .bar{display:none}
  .row{grid-template-columns:minmax(0,1fr) 260px 170px;padding:8px 12px;break-inside:avoid}
  .colhead{grid-template-columns:minmax(0,1fr) 260px 170px}
  .month{break-inside:auto}
  .month summary{break-after:avoid}
  .month summary::after{content:none}
  .scroll{overflow:visible}
  .sns{break-before:page}
  .sns tr{break-inside:avoid}
  .pdfonly{display:block}
}
.pdfonly{display:none}
</style>

<script>
(function(){

const fmt=n=>typeof n==='number'?n.toLocaleString('ja-JP'):'—';

    return'<details class="month"'+(D.print||i<3||q||mF?' open':'')+'><summary><h2>'+ml(m)+'</h2><span class="cnt"><b>'+rows.length+'</b> 本</span></summary><div class="colhead"><span>動画</span><span>日程</span><span></span></div>'

}
document.getElementById('q').addEventListener('input',render);
sel.addEventListener('change',render);
document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{stF=b.dataset.st;document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()}));

})();
</script>
