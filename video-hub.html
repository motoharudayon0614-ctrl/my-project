<title>SNS運用 動画管理基盤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Barlow+Semi+Condensed:wght@500;600&display=swap">
<style>
/* Layout: sticky header with month stepper + tabs; each tab is a scannable work surface (summary first, detail below). */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --sunk:#eaeef3; --ink:#17283b; --muted:#5a6a7c; --line:#d9e0e8;
  --accent:#22405f; --accent-ink:#ffffff; --basic:#c96f22; --pro:#d0312a;
  --good:#1d8656; --warn:#a87400; --bad:#c3372d;
  --ig:#c13584; --tt:#0e8f8f; --yt:#d92323; --shoot:#6a4fc9; --due:#c96f22; --post:#1f72bd;
  --font:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --num:"Barlow Semi Condensed","Zen Kaku Gothic New",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1620; --surface:#17212d; --sunk:#121a24; --ink:#e5ecf4; --muted:#97a6b7; --line:#2a3746;
  --accent:#8db4dc; --accent-ink:#0f1620; --basic:#e8954f; --pro:#ef5d55;
  --good:#45c08a; --warn:#e2b23a; --bad:#f06c61;
  --ig:#e46cb4; --tt:#3ccaca; --yt:#ff6060; --shoot:#a690f2; --due:#e8954f; --post:#5eaaee; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1620; --surface:#17212d; --sunk:#121a24; --ink:#e5ecf4; --muted:#97a6b7; --line:#2a3746;
  --accent:#8db4dc; --accent-ink:#0f1620; --basic:#e8954f; --pro:#ef5d55;
  --good:#45c08a; --warn:#e2b23a; --bad:#f06c61;
  --ig:#e46cb4; --tt:#3ccaca; --yt:#ff6060; --shoot:#a690f2; --due:#e8954f; --post:#5eaaee; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.6}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.brand{font-weight:700;font-size:16px;letter-spacing:.02em;margin-right:auto}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.08em}
.month{display:flex;align-items:center;gap:4px}
.month b{font-family:var(--num);font-size:20px;min-width:96px;text-align:center}
nav{max-width:1240px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto}
nav button{border:0;background:none;color:var(--muted);padding:10px 14px;font:inherit;font-weight:500;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
main{max-width:1240px;margin:0 auto;padding-block:20px 60px;padding-inline:16px;display:grid;gap:20px}
h2{font-size:17px;margin:0;text-wrap:balance}
h3{font-size:14px;margin:0}
.sec{display:grid;gap:12px;min-width:0}
.sec-h{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.hint{color:var(--muted);font-size:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px}
.tile .lbl{font-size:12px;color:var(--muted);letter-spacing:.04em}
.tile .val{font-family:var(--num);font-size:30px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .sub{font-size:12px;color:var(--muted)}
.tile.alert .val{color:var(--bad)}
button,.btn{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px}
button:hover{border-color:var(--muted)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.ghost{border-color:transparent;background:transparent}
.danger{color:var(--bad)}
.danger[data-armed="1"]{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.icon{padding:4px 10px;font-size:16px;line-height:1}
select,input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}
th{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.06em;background:var(--sunk);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.wrap{white-space:normal;min-width:180px}
tr.late td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid currentColor;line-height:1.6;white-space:nowrap}
.chip.basic{color:var(--basic)} .chip.pro{color:var(--pro)} .chip.custom{color:var(--muted)}
.chip.bad{color:var(--bad)} .chip.warn{color:var(--warn)} .chip.good{color:var(--good)} .chip.muted{color:var(--muted)}
.pf{display:inline-block;font-size:10px;font-weight:700;padding:0 5px;border-radius:4px;color:var(--surface);margin-right:2px}
.pf.ig{background:var(--ig)} .pf.tt{background:var(--tt)} .pf.yt{background:var(--yt)}
.st{font-size:12px;padding:3px 6px;border-radius:6px}
.st[data-s="投稿済"],.st[data-s="納品済"]{color:var(--good);border-color:var(--good)}
.st[data-s="修正中"]{color:var(--warn);border-color:var(--warn)}
.prog{display:grid;gap:3px;min-width:120px}
.prog .t{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.prog .track{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.prog .fill{height:100%;background:var(--accent)}
.prog .fill.full{background:var(--good)}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--muted)}
.alerts{display:grid;gap:6px}
.alert-row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:8px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.alert-row.bad{border-left:4px solid var(--bad)} .alert-row.warn{border-left:4px solid var(--warn)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty b{color:var(--ink);font-size:15px}
/* editors */
.ed-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ed{display:grid;gap:10px}
.ed .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ed .big{font-family:var(--num);font-size:34px;font-weight:600;line-height:1}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunk)}
.stack span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:12px}
.kv span:nth-child(even){font-family:var(--num);font-size:14px;text-align:right}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(100px,1fr));min-width:720px}
.cal .dow{font-size:11px;color:var(--muted);padding:6px 8px;background:var(--sunk);border-bottom:1px solid var(--line)}
.cal .day{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 5px;display:flex;flex-direction:column;gap:2px}
.cal .day:nth-child(7n){border-right:0}
.cal .day.out{background:var(--sunk);opacity:.55}
.cal .day.today .d{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 6px}
.cal .d{font-family:var(--num);font-size:13px;align-self:flex-start}
.ev{font-size:11px;line-height:1.35;padding:1px 5px;border-radius:4px;border-left:3px solid;background:var(--sunk);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;text-align:left;border-top:0;border-right:0;border-bottom:0;width:100%}
.ev.shoot{border-color:var(--shoot)} .ev.due{border-color:var(--due)} .ev.post{border-color:var(--post)}
.ev.done{opacity:.55;text-decoration:line-through}
.key{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.key i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.agenda{display:grid;gap:4px}
.agenda .row{display:grid;grid-template-columns:86px 1fr;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);align-items:start}
.agenda .row:last-child{border-bottom:0}
.agenda .dt{font-family:var(--num);font-size:15px}
.agenda .items{display:flex;flex-direction:column;gap:3px;min-width:0}
/* report */
.rep-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;align-items:end;border-bottom:2px solid var(--accent);padding-bottom:10px}
.rep-head .ttl{font-size:22px;font-weight:700}
.rep-head .meta{color:var(--muted);font-size:12px}
.plat{display:grid;gap:12px}
.plat-h{display:flex;align-items:center;gap:8px}
.plat-h .dot{width:12px;height:12px;border-radius:3px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:1px;min-width:0}
.kpi .lbl{font-size:11px;color:var(--muted)}
.kpi .v{font-family:var(--num);font-size:24px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .cmp{font-size:12px;font-family:var(--num);font-variant-numeric:tabular-nums}
.kpi .prev{font-size:11px;color:var(--muted)}
.kpi.key-kpi{background:var(--sunk)}
.plat-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:16px;align-items:start}
@media (max-width:820px){.plat-body{grid-template-columns:1fr}}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--num);font-size:10px}
.note{white-space:pre-wrap;background:var(--sunk);border-radius:8px;padding:12px;font-size:13px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:640px;padding:18px;display:grid;gap:14px;border:1px solid var(--line)}
.modal .mh{display:flex;justify-content:space-between;align-items:center}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.form label{display:grid;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.form label.full{grid-column:1/-1}
.form input,.form select,.form textarea{width:100%;color:var(--ink)}
.form fieldset{grid-column:1/-1;border:1px solid var(--line);border-radius:8px;padding:8px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px 12px;margin:0}
.form legend{font-size:12px;font-weight:700;padding:0 4px;color:var(--ink)}
.checks{display:flex;gap:14px;flex-wrap:wrap;color:var(--ink)}
.checks label{display:flex;gap:4px;align-items:center;font-size:13px;color:var(--ink)}
.checks input{width:auto}
@media (max-width:520px){.form{grid-template-columns:1fr}}
.mf{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.mf .r{display:flex;gap:8px;margin-left:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;z-index:60;font-size:13px}
.notice{padding:10px 14px;border-radius:8px;border:1px solid var(--warn);color:var(--ink);background:var(--surface);font-size:13px}
.cl-row td:first-child{font-weight:700}
@media (prefers-reduced-motion:no-preference){.prog .fill{transition:width .3s}}
</style>

<header>
  <div class="bar">
    <div class="brand">動画管理基盤<small>SNS運用代行 ／ 制作・撮影・投稿・レポート</small></div>
    <div class="month" aria-label="対象月">
      <button class="icon" data-act="mprev" aria-label="前の月">‹</button>
      <b id="mlabel" class="num"></b>
      <button class="icon" data-act="mnext" aria-label="次の月">›</button>
      <button data-act="mnow">今月</button>
    </div>
  </div>
  <nav role="tablist" id="tabs">
    <button role="tab" data-tab="dash">全体</button>
    <button role="tab" data-tab="prod">制作管理</button>
    <button role="tab" data-tab="cal">スケジュール</button>
    <button role="tab" data-tab="ed">編集者</button>
    <button role="tab" data-tab="rep">月次レポート</button>
    <button role="tab" data-tab="cli">クライアント</button>
  </nav>
</header>
<main id="main"><div class="empty"><b>読み込み中…</b></div></main>
<div id="modal-root"></div>

<script>
(function(){
const PLAT={
  ig:{name:'Instagram',fields:[['followers','フォロワー数'],['posts','投稿本数'],['views','再生数'],['reach','リーチ'],['likes','いいね'],['comments','コメント'],['saves','保存']],eng:['likes','comments','saves']},
  tt:{name:'TikTok',fields:[['followers','フォロワー数'],['posts','投稿本数'],['views','再生数'],['likes','いいね'],['comments','コメント'],['shares','シェア']],eng:['likes','comments','shares']},
  yt:{name:'YouTube',fields:[['followers','チャンネル登録者'],['posts','投稿本数'],['views','再生回数'],['watchHours','総再生時間(時間)'],['likes','高評価'],['comments','コメント']],eng:['likes','comments']}
};
const STATUSES=['企画','撮影待ち','編集中','確認中','修正中','納品済','投稿済'];
const ST_COLOR={'企画':'var(--muted)','撮影待ち':'var(--shoot)','編集中':'var(--post)','確認中':'var(--accent)','修正中':'var(--warn)','納品済':'var(--good)','投稿済':'var(--good)'};
const DONE=new Set(['納品済','投稿済']);
const TYPES={short:'ショート',long:'YouTube(横)'};
const PLANS={basic:{label:'BASIC',short:4,long:1},pro:{label:'PRO',short:4,long:4},custom:{label:'カスタム',short:0,long:0}};

const pad=n=>String(n).padStart(2,'0');
const today=new Date(); const TODAY=today.getFullYear()+'-'+pad(today.getMonth()+1)+'-'+pad(today.getDate());
const ymOf=d=>d.slice(0,7);
const madd=(m,n)=>{const [y,mo]=m.split('-').map(Number);const d=new Date(y,mo-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const mlabel=m=>{const [y,mo]=m.split('-');return y+'年'+Number(mo)+'月'};
const mshort=m=>Number(m.split('-')[1])+'月';
const dadd=(d,n)=>{const [y,m,dd]=d.split('-').map(Number);const x=new Date(y,m-1,dd+n);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate())};
const dlabel=d=>{if(!d)return'—';const [y,m,dd]=d.split('-').map(Number);const w='日月火水木金土'[new Date(y,m-1,dd).getDay()];return m+'/'+dd+'('+w+')'};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isNum=v=>typeof v==='number'&&isFinite(v);
const fmt=(n,dp)=>isNum(n)?n.toLocaleString('ja-JP',{maximumFractionDigits:dp==null?0:dp,minimumFractionDigits:dp||0}):'—';

const S={tab:'dash',month:ymOf(TODAY),clients:[],videos:[],shoots:[],metrics:[],db:null,loaded:0,
  f:{client:'',editor:'',status:'',scope:'month',hideDone:false},calClient:'',repClient:''};
try{const t=localStorage.getItem('vh.tab');if(t)S.tab=t;const rc=localStorage.getItem('vh.rep');if(rc)S.repClient=rc}catch(e){}

const cById=id=>S.clients.find(c=>c.id===id);
const cName=id=>{const c=cById(id);return c?c.name:'(削除済み)'};
const activeClients=()=>S.clients.filter(c=>c.active!==false).sort((a,b)=>(a.name||'').localeCompare(b.name||'','ja'));
const quota=c=>{const p=PLANS[c.plan]||PLANS.custom;return{short:isNum(c.shortQuota)?c.shortQuota:p.short,long:isNum(c.longQuota)?c.longQuota:p.long}};
const isLate=v=>v.dueDate&&v.dueDate<TODAY&&!DONE.has(v.status);
const metricsFor=(cid,m)=>S.metrics.find(x=>x.clientId===cid&&x.month===m);
const editors=()=>[...new Set(S.videos.map(v=>(v.editor||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
const postedCount=(cid,m,p)=>S.videos.filter(v=>v.clientId===cid&&(v.postDate||'').startsWith(m)&&(v.platforms||[]).includes(p)).length;
const planChip=c=>{const p=c.plan||'custom';return'<span class="chip '+esc(p)+'">'+esc((PLANS[p]||PLANS.custom).label)+'</span>'};
const pfTags=ps=>(ps||[]).map(p=>'<span class="pf '+p+'">'+({ig:'IG',tt:'TT',yt:'YT'}[p]||p)+'</span>').join('');

function deltaHtml(cur,prev,opts){
  opts=opts||{};
  if(!isNum(cur)||!isNum(prev))return'<span class="flat">前月データなし</span>';
  const d=cur-prev; const cls=d>0?'up':d<0?'down':'flat'; const arrow=d>0?'▲':d<0?'▼':'±';
  const pct=prev!==0?(d/Math.abs(prev)*100):null;
  const ds=opts.pct?(d>0?'+':'')+fmt(d,1)+'pt':(d>0?'+':'')+fmt(d,opts.dp);
  return'<span class="'+cls+'">'+arrow+' '+ds+(pct!=null&&!opts.pct?' ('+(pct>0?'+':'')+fmt(pct,1)+'%)':'')+'</span>';
}

/* ---------- toast & modal ---------- */
let toastT;
function toast(msg){let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},2600)}
let modalSave=null,modalDel=null;
function openModal(title,fieldsHtml,onSave,onDel){
  modalSave=onSave;modalDel=onDel||null;
  document.getElementById('modal-root').innerHTML='<div class="ov" data-act="ovclose"><div class="modal" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="mh"><h2>'+esc(title)+'</h2><button class="ghost icon" data-act="mclose" aria-label="閉じる">×</button></div><form class="form" id="mform">'+fieldsHtml+'</form><div class="mf">'+(onDel?'<button class="danger" data-act="mdel">削除</button>':'')+'<div class="r"><button data-act="mclose">キャンセル</button><button class="primary" data-act="msave">保存</button></div></div></div></div>';
  const f=document.querySelector('#mform input,#mform select');if(f)f.focus();
}
function closeModal(){document.getElementById('modal-root').innerHTML='';modalSave=modalDel=null;render()}
function field(o){
  const id='f_'+o.k; const v=o.v==null?'':o.v; const cls=o.full?' class="full"':'';
  if(o.type==='select')return'<label'+cls+'>'+esc(o.label)+'<select id="'+id+'" name="'+o.k+'">'+o.options.map(([val,l])=>'<option value="'+esc(val)+'"'+(String(val)===String(v)?' selected':'')+'>'+esc(l)+'</option>').join('')+'</select></label>';
  if(o.type==='textarea')return'<label class="full">'+esc(o.label)+'<textarea id="'+id+'" name="'+o.k+'" rows="'+(o.rows||3)+'">'+esc(v)+'</textarea></label>';
  if(o.type==='checks')return'<div class="full"><div class="hint" style="margin-bottom:3px">'+esc(o.label)+'</div><div class="checks">'+o.options.map(([val,l])=>'<label><input type="checkbox" name="'+o.k+'" value="'+esc(val)+'"'+((v||[]).includes(val)?' checked':'')+'>'+esc(l)+'</label>').join('')+'</div></div>';
  return'<label'+cls+'>'+esc(o.label)+'<input id="'+id+'" name="'+o.k+'" type="'+(o.type||'text')+'" value="'+esc(v)+'"'+(o.list?' list="'+o.list+'"':'')+(o.ph?' placeholder="'+esc(o.ph)+'"':'')+(o.type==='number'?' inputmode="decimal" step="any"':'')+'></label>';
}
function formVals(){
  const f=document.getElementById('mform');const out={};
  f.querySelectorAll('input,select,textarea').forEach(el=>{
    if(!el.name)return;
    if(el.type==='checkbox'){(out[el.name]=out[el.name]||[]);if(el.checked)out[el.name].push(el.value);return}
    if(el.type==='number'){out[el.name]=el.value===''?null:Number(el.value);return}
    out[el.name]=el.value.trim();
  });
  return out;
}

/* ---------- db ---------- */
async function save(col,id,data){
  if(!S.db){toast('この表示では保存できません');return false}
  try{data.updatedAt=new Date().toISOString();if(id)await S.db.collection(col).doc(id).set(data);else await S.db.collection(col).add(data);return true}
  catch(e){toast(e&&e.code==='invalid_argument'?'保存する権限がありません（閲覧のみの共有です）':'保存できませんでした。もう一度お試しください');return false}
}
async function upd(col,id,data){try{await S.db.collection(col).doc(id).update(data);return true}catch(e){toast('更新できませんでした');return false}}
async function del(col,id){try{await S.db.collection(col).doc(id).delete();return true}catch(e){toast('削除できませんでした');return false}}

function editMetrics(cid,m){
  const ex=metricsFor(cid,m)||{};
  let html='<div class="full hint">'+esc(cName(cid))+' ／ '+mlabel(m)+'の数字を入力します。各SNSのインサイト（管理画面）の月末時点の値を転記してください。投稿本数が空欄なら、制作管理の投稿予定日から自動で数えます。</div>';
  for(const [p,def] of Object.entries(PLAT)){
    html+='<fieldset><legend><span class="pf '+p+'">'+p.toUpperCase()+'</span> '+def.name+'</legend>'+def.fields.map(([k,l])=>{
      const v=ex[p]&&isNum(ex[p][k])?ex[p][k]:'';const ph=k==='posts'?'自動: '+postedCount(cid,m,p):'';
      return'<label>'+esc(l)+'<input name="'+p+'.'+k+'" type="number" inputmode="decimal" step="any" value="'+v+'" placeholder="'+ph+'"></label>'}).join('')+'</fieldset>';
  }
  html+=field({k:'note',label:'所感・来月の施策（お客様向けコメント）',type:'textarea',v:ex.note,rows:4});
  openModal('数値入力',html,async()=>{
    const raw=formVals();const d={clientId:cid,month:m,note:raw.note||''};
    for(const p of Object.keys(PLAT)){d[p]={};for(const [k] of PLAT[p].fields){const v=raw[p+'.'+k];if(isNum(v))d[p][k]=v}}
    if(await save('metrics',cid+'_'+m,d)){closeModal();toast('保存しました')}
  });
}

/* ---------- views ---------- */
function needClients(){
  return'<div class="panel empty"><b>まずクライアントを登録しましょう</b><span>契約プラン（BASIC／PRO）を選ぶと、月の制作ノルマが自動で入ります。</span><button class="primary" data-act="addClient">クライアントを追加</button></div>';
}
function progBar(label,done,total){
  const pct=total?Math.min(100,done/total*100):(done?100:0);
  return'<div class="prog"><div class="t"><span>'+label+'</span><span class="num">'+done+' / '+total+'</span></div><div class="track"><div class="fill'+(total&&done>=total?' full':'')+'" style="width:'+pct+'%"></div></div></div>';
}
function followersTotal(cid,m){const x=metricsFor(cid,m);if(!x)return null;let t=0,any=false;for(const p of Object.keys(PLAT)){const v=x[p]&&x[p].followers;if(isNum(v)){t+=v;any=true}}return any?t:null}

function viewDash(){
  const cl=activeClients(); if(!cl.length)return needClients();
  const m=S.month; const mv=S.videos.filter(v=>(v.dueDate||'').startsWith(m));
  const late=S.videos.filter(isLate).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  const soon=S.videos.filter(v=>!DONE.has(v.status)&&v.dueDate&&v.dueDate>=TODAY&&v.dueDate<=dadd(TODAY,3)).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  const wk=dadd(TODAY,7);
  const shootsWk=S.shoots.filter(s=>s.date>=TODAY&&s.date<=wk).length;
  const postsWk=S.videos.filter(v=>v.postDate>=TODAY&&v.postDate<=wk).length;
  const quotaTotal=cl.reduce((a,c)=>{const q=quota(c);return a+q.short+q.long},0);
  const doneM=mv.filter(v=>DONE.has(v.status)).length;

    +'<div class="tile"><span class="lbl">運用中クライアント</span><span class="val">'+cl.length+'</span><span class="sub">BASIC '+cl.filter(c=>c.plan==='basic').length+' ／ PRO '+cl.filter(c=>c.plan==='pro').length+'</span></div>'
    +'<div class="tile"><span class="lbl">今月の納品</span><span class="val">'+doneM+'<small style="font-size:16px;color:var(--muted)"> / '+Math.max(quotaTotal,mv.length)+'本</small></span><span class="sub">契約本数 '+quotaTotal+'本 ／ 登録 '+mv.length+'本</span></div>'
    +'<div class="tile'+(late.length?' alert':'')+'"><span class="lbl">納期遅れ</span><span class="val">'+late.length+'</span><span class="sub">3日以内の納期 '+soon.length+'本</span></div>'
    +'<div class="tile"><span class="lbl">7日以内の撮影</span><span class="val">'+shootsWk+'</span><span class="sub">投稿予定 '+postsWk+'本</span></div></div></section>';
  if(late.length||soon.length){
    h+='<section class="sec"><h2>要対応</h2><div class="alerts">'
      +late.map(v=>'<div class="alert-row bad"><span class="chip bad">遅れ '+Math.round((new Date(TODAY)-new Date(v.dueDate))/864e5)+'日</span><b>'+esc(v.title)+'</b><span class="hint">'+esc(cName(v.clientId))+' ・ '+esc(v.editor||'担当未定')+' ・ 納期 '+dlabel(v.dueDate)+' ・ '+esc(v.status)+'</span><button class="ghost" data-act="editVideo" data-id="'+v.id+'">開く</button></div>').join('')
      +soon.map(v=>'<div class="alert-row warn"><span class="chip warn">納期 '+dlabel(v.dueDate)+'</span><b>'+esc(v.title)+'</b><span class="hint">'+esc(cName(v.clientId))+' ・ '+esc(v.editor||'担当未定')+' ・ '+esc(v.status)+'</span><button class="ghost" data-act="editVideo" data-id="'+v.id+'">開く</button></div>').join('')
      +'</div></section>';
  }
  const pm=madd(m,-1);
  h+='<section class="sec"><div class="sec-h"><h2>クライアント別</h2><span class="hint">制作は納期が'+mshort(m)+'の動画、フォロワーは'+mshort(m)+'と'+mshort(pm)+'の入力値で比較</span></div><div class="scroll"><table><thead><tr><th>クライアント</th><th>プラン</th><th>ショート</th><th>YouTube</th><th>遅れ</th><th>次の撮影</th><th>次の投稿</th><th class="r">フォロワー合計</th><th>前月比</th></tr></thead><tbody>'
    +cl.map(c=>{
      const q=quota(c);const vs=mv.filter(v=>v.clientId===c.id);
      const sd=vs.filter(v=>v.type!=='long'&&DONE.has(v.status)).length, ld=vs.filter(v=>v.type==='long'&&DONE.has(v.status)).length;

  return h;
}

function viewProd(){
  if(!activeClients().length)return needClients();
  const f=S.f; const m=S.month;
  let list=S.videos.slice();
  if(f.scope==='month')list=list.filter(v=>(v.dueDate||'').startsWith(m)||(v.postDate||'').startsWith(m)||(v.shootDate||'').startsWith(m)||(!v.dueDate&&!DONE.has(v.status)));
  if(f.client)list=list.filter(v=>v.clientId===f.client);
  if(f.editor)list=list.filter(v=>(v.editor||'')===f.editor);
  if(f.status)list=list.filter(v=>v.status===f.status);
  if(f.hideDone)list=list.filter(v=>!DONE.has(v.status));
  list.sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999'));
  const counts=STATUSES.map(s=>[s,list.filter(v=>v.status===s).length]);
  let h='<section class="sec"><div class="sec-h"><h2>制作管理</h2><div class="filters">'
    +'<button class="primary" data-act="addVideo">＋ 動画を追加</button></div></div>'
    +'<div class="filters">'
    +'<select id="f-scope" data-act="filt" data-k="scope" aria-label="期間"><option value="month"'+(f.scope==='month'?' selected':'')+'>'+mlabel(m)+'に関係する動画</option><option value="all"'+(f.scope==='all'?' selected':'')+'>すべての期間</option></select>'
    +'<select id="f-client" data-act="filt" data-k="client" aria-label="クライアント">'+clientOptions('全クライアント').map(([v,l])=>'<option value="'+esc(v)+'"'+(v===f.client?' selected':'')+'>'+esc(l)+'</option>').join('')+'</select>'
    +'<select id="f-editor" data-act="filt" data-k="editor" aria-label="編集者"><option value="">全編集者</option>'+editors().map(e=>'<option'+(e===f.editor?' selected':'')+'>'+esc(e)+'</option>').join('')+'</select>'
    +'<select id="f-status" data-act="filt" data-k="status" aria-label="ステータス"><option value="">全ステータス</option>'+STATUSES.map(s=>'<option'+(s===f.status?' selected':'')+'>'+s+'</option>').join('')+'</select>'
    +'<label class="hint" style="display:flex;gap:4px;align-items:center"><input type="checkbox" id="f-hide" data-act="filt" data-k="hideDone"'+(f.hideDone?' checked':'')+'>完了を隠す</label>'
    +'</div><div class="legend">'+counts.map(([s,n])=>'<span><i style="background:'+ST_COLOR[s]+'"></i>'+s+' <b class="num">'+n+'</b></span>').join('')+'</div>';
  if(!list.length){h+='<div class="panel empty"><b>該当する動画はありません</b><span>「＋ 動画を追加」で企画を登録すると、納期・撮影日・投稿日がスケジュールにも反映されます。</span></div></section>';return h}
  h+='<div class="scroll"><table><thead><tr><th>納期</th><th>タイトル</th><th>クライアント</th><th>種類</th><th>編集者</th><th>ステータス</th><th>撮影日</th><th>投稿予定</th><th>投稿先</th><th></th></tr></thead><tbody>'
    +list.map(v=>{const late=isLate(v);return'<tr class="'+(late?'late':'')+'"><td class="num">'+dlabel(v.dueDate)+(late?' <span class="chip bad">遅れ</span>':'')+'</td><td class="wrap"><b>'+esc(v.title)+'</b>'+(v.memo?'<div class="hint">'+esc(v.memo)+'</div>':'')+'</td><td>'+esc(cName(v.clientId))+'</td><td>'+esc(TYPES[v.type]||'')+'</td><td>'+esc(v.editor||'—')+'</td><td><select class="st" data-s="'+esc(v.status)+'" data-act="status" data-id="'+v.id+'" aria-label="ステータス">'+STATUSES.map(s=>'<option'+(s===v.status?' selected':'')+'>'+s+'</option>').join('')+'</select></td><td class="num">'+dlabel(v.shootDate)+'</td><td class="num">'+dlabel(v.postDate)+'</td><td>'+pfTags(v.platforms)+'</td><td>'+(v.url?'<a href="'+esc(v.url)+'" target="_blank" rel="noopener">リンク</a> ':'')+'<button class="ghost" data-act="editVideo" data-id="'+v.id+'">編集</button></td></tr>'}).join('')

  return h;

function viewEd(){
  const m=S.month;
  const mv=S.videos.filter(v=>(v.dueDate||'').startsWith(m));
  const names=[...new Set(mv.map(v=>(v.editor||'').trim()||'担当未定'))].sort((a,b)=>a==='担当未定'?1:b==='担当未定'?-1:a.localeCompare(b,'ja'));
  let h='<section class="sec"><div class="sec-h"><h2>編集者別の本数（納期が'+mlabel(m)+'）</h2><span class="hint">納品済＋投稿済を「完了」として数えます</span></div>';
  if(!names.length)return h+'<div class="panel empty"><b>'+mlabel(m)+'が納期の動画はまだありません</b><span>制作管理で動画に「担当編集者」と「納期」を入れると、ここに集計されます。</span></div></section>';
  h+='<div class="legend">'+STATUSES.map(s=>'<span><i style="background:'+ST_COLOR[s]+'"></i>'+s+'</span>').join('')+'</div><div class="ed-grid">';
  for(const n of names){
    const vs=mv.filter(v=>((v.editor||'').trim()||'担当未定')===n);
    const done=vs.filter(v=>DONE.has(v.status)).length, late=vs.filter(isLate).length;
    const byClient={};vs.forEach(v=>{const k=cName(v.clientId);byClient[k]=(byClient[k]||0)+1});
    const sh=vs.filter(v=>v.type!=='long').length, lo=vs.length-sh;
    h+='<div class="panel ed"><div class="top"><h3>'+esc(n)+'</h3>'+(late?'<span class="chip bad">遅れ '+late+'</span>':'')+'</div>'
      +'<div style="display:flex;gap:14px;align-items:baseline"><span class="big">'+vs.length+'</span><span class="hint">本担当 ／ 完了 <b class="num">'+done+'</b> ／ 残り <b class="num">'+(vs.length-done)+'</b></span></div>'
      +'<div class="stack" role="img" aria-label="ステータス内訳">'+STATUSES.map(s=>{const c=vs.filter(v=>v.status===s).length;return c?'<span title="'+s+' '+c+'本" style="width:'+(c/vs.length*100)+'%;background:'+ST_COLOR[s]+'"></span>':''}).join('')+'</div>'
      +'<div class="kv"><span>ショート</span><span>'+sh+'</span><span>YouTube(横)</span><span>'+lo+'</span>'+Object.entries(byClient).map(([k,c])=>'<span class="hint">'+esc(k)+'</span><span>'+c+'</span>').join('')+'</div>'
      +'<button class="ghost" style="justify-self:start;padding-left:0" data-act="edFilter" data-name="'+esc(n==='担当未定'?'':n)+'">一覧で見る →</button></div>';
  }
  h+='</div></section>';
  // editor x client matrix over last 6 months
  const months=[...Array(6)].map((_,i)=>madd(m,i-5));
  const allEd=editors();
  if(allEd.length){
    h+='<section class="sec"><h2>月別の完了本数（直近6ヶ月）</h2><div class="scroll"><table><thead><tr><th>編集者</th>'+months.map(x=>'<th class="r">'+mshort(x)+'</th>').join('')+'<th class="r">合計</th></tr></thead><tbody>'
      +allEd.map(e=>{let tot=0;return'<tr><td>'+esc(e)+'</td>'+months.map(x=>{const c=S.videos.filter(v=>v.editor===e&&(v.dueDate||'').startsWith(x)&&DONE.has(v.status)).length;tot+=c;return'<td class="r num">'+(c||'<span class="hint">0</span>')+'</td>'}).join('')+'<td class="r num"><b>'+tot+'</b></td></tr>'}).join('')
      +'</tbody></table></div></section>';
  }
  return h;
}

function calEvents(){
  const ev=[];const cf=S.calClient;
  S.shoots.forEach(s=>{if(cf&&s.clientId!==cf)return;ev.push({d:s.date,k:'shoot',t:'撮影 '+cName(s.clientId)+(s.time?' '+s.time:''),sub:(s.place||'')+(s.people?' ・'+s.people+'名':''),id:s.id,act:'editShoot'})});
  S.videos.forEach(v=>{if(cf&&v.clientId!==cf)return;
    if(v.dueDate)ev.push({d:v.dueDate,k:'due',t:'納期 '+cName(v.clientId)+'｜'+v.title,sub:(v.editor||'担当未定')+' ・ '+v.status,id:v.id,act:'editVideo',done:DONE.has(v.status),late:isLate(v)});
    if(v.postDate)ev.push({d:v.postDate,k:'post',t:'投稿 '+cName(v.clientId)+'｜'+v.title,sub:(v.platforms||[]).map(p=>PLAT[p]?PLAT[p].name:p).join('・'),pf:v.platforms,id:v.id,act:'editVideo',done:v.status==='投稿済'});
  });
  return ev;
}
function viewCal(){
  if(!activeClients().length)return needClients();
  const m=S.month;const [y,mo]=m.split('-').map(Number);
  const first=new Date(y,mo-1,1);const start=dadd(m+'-01',-first.getDay());
  const ev=calEvents();const byDay={};ev.forEach(e=>{(byDay[e.d]=byDay[e.d]||[]).push(e)});
  const order={shoot:0,due:1,post:2};Object.values(byDay).forEach(a=>a.sort((x,y)=>order[x.k]-order[y.k]));
  let h='<section class="sec"><div class="sec-h"><h2>スケジュール</h2><div class="filters"><select id="cal-client" data-act="calClient" aria-label="クライアント">'+clientOptions('全クライアント').map(([v,l])=>'<option value="'+esc(v)+'"'+(v===S.calClient?' selected':'')+'>'+esc(l)+'</option>').join('')+'</select><button data-act="addShoot">＋ 撮影予定</button><button class="primary" data-act="addVideo">＋ 動画</button></div></div>'
    +'<div class="key"><span><i style="background:var(--shoot)"></i>撮影</span><span><i style="background:var(--due)"></i>納期（編集締切）</span><span><i style="background:var(--post)"></i>投稿予定</span><span>取り消し線＝完了</span></div>'
    +'<div class="scroll"><div class="cal">'+'日月火水木金土'.split('').map(d=>'<div class="dow">'+d+'</div>').join('');
  for(let i=0;i<42;i++){
    const d=dadd(start,i);if(i>=35&&!d.startsWith(m))break;
    const es=byDay[d]||[];
    h+='<div class="day'+(d.startsWith(m)?'':' out')+(d===TODAY?' today':'')+'"><span class="d">'+Number(d.slice(8))+'</span>'
      +es.slice(0,5).map(e=>'<button class="ev '+e.k+(e.done?' done':'')+'" data-act="'+e.act+'" data-id="'+e.id+'" title="'+esc(e.t+' / '+e.sub)+'"'+(e.late?' style="color:var(--bad)"':'')+'>'+esc(e.t)+'</button>').join('')
      +(es.length>5?'<span class="hint">他 '+(es.length-5)+'件</span>':'')+'</div>';
  }
  h+='</div></div></section>';
  const upcoming=ev.filter(e=>e.d>=TODAY&&e.d<=dadd(TODAY,14)).sort((a,b)=>a.d.localeCompare(b.d)||order[a.k]-order[b.k]);
  const grp={};upcoming.forEach(e=>{(grp[e.d]=grp[e.d]||[]).push(e)});
  h+='<section class="sec"><h2>これから2週間</h2><div class="panel">'+(upcoming.length?'<div class="agenda">'+Object.entries(grp).map(([d,es])=>'<div class="row"><div class="dt">'+dlabel(d)+'</div><div class="items">'+es.map(e=>'<button class="ev '+e.k+'" data-act="'+e.act+'" data-id="'+e.id+'" style="white-space:normal">'+esc(e.t)+(e.pf?' '+pfTags(e.pf):'')+'<span class="hint"> '+esc(e.sub)+'</span></button>').join('')+'</div></div>').join('')+'</div>':'<div class="empty"><span>今後2週間の予定はありません。</span></div>')+'</div></section>';
  return h;
}

function trendSvg(cid,p,m){
  const months=[...Array(6)].map((_,i)=>madd(m,i-5));
  const rows=months.map(x=>{const d=metricsFor(cid,x);return{m:x,f:d&&d[p]?d[p].followers:null,v:d&&d[p]?d[p].views:null}});
  if(rows.filter(r=>isNum(r.f)||isNum(r.v)).length<2)return'<div class="hint" style="padding:12px 0">2ヶ月分以上入力すると推移グラフが出ます。</div>';
  const W=340,H=170,L=8,R=8,T=26,B=22,iw=W-L-R,ih=H-T-B,bw=iw/6;
  const vmax=Math.max(1,...rows.map(r=>isNum(r.v)?r.v:0));
  const fs=rows.filter(r=>isNum(r.f)).map(r=>r.f);let fmin=Math.min(...fs),fmax=Math.max(...fs);if(fmin===fmax){fmin-=1;fmax+=1}const padF=(fmax-fmin)*.15;fmin-=padF;fmax+=padF;
  const col='var(--'+p+')';
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+PLAT[p].name+'の6ヶ月推移">';
  for(let g=0;g<=2;g++){const y=T+ih*g/2;s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" style="stroke:var(--line)" stroke-width="1"/>'}
  rows.forEach((r,i)=>{const x=L+bw*i;if(isNum(r.v)){const bh=r.v/vmax*ih;s+='<rect x="'+(x+bw*.22)+'" y="'+(T+ih-bh)+'" width="'+(bw*.56)+'" height="'+bh+'" rx="2" style="fill:'+col+';opacity:.22"/>'}s+='<text x="'+(x+bw/2)+'" y="'+(H-6)+'" text-anchor="middle" style="fill:var(--muted)">'+mshort(r.m)+'</text>'});
  const pts=rows.map((r,i)=>isNum(r.f)?[L+bw*i+bw/2,T+ih-(r.f-fmin)/(fmax-fmin)*ih,r.f]:null).filter(Boolean);
  if(pts.length>1)s+='<polyline points="'+pts.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')+'" style="fill:none;stroke:'+col+'" stroke-width="2.2" stroke-linejoin="round"/>';
  pts.forEach((q,i)=>{const last=i===pts.length-1;s+='<circle cx="'+q[0]+'" cy="'+q[1]+'" r="'+(last?4.5:2.5)+'" style="fill:'+(last?col:'var(--surface)')+';stroke:'+col+'" stroke-width="1.6"/>';if(last)s+='<text x="'+Math.min(q[0],W-R-2)+'" y="'+(q[1]-9)+'" text-anchor="end" style="fill:var(--ink);font-weight:600;font-size:11px">'+fmt(q[2])+'</text>'});
  s+='</svg>';
  return'<div class="chart">'+s+'<div class="legend"><span><i style="background:'+col+'"></i>'+(p==='yt'?'登録者':'フォロワー')+'（線）</span><span><i style="background:'+col+';opacity:.3"></i>再生数（棒）</span></div></div>';
}
function platMetrics(d,p,cid,m){
  if(!d||!d[p])return null;const x=Object.assign({},d[p]);
  if(!isNum(x.posts)){const c=postedCount(cid,m,p);if(c)x.posts=c}
  if(isNum(x.views)&&isNum(x.posts)&&x.posts>0){x.vpp=x.views/x.posts}
  if(isNum(x.likes)&&isNum(x.posts)&&x.posts>0){x.lpp=x.likes/x.posts}
  const eng=PLAT[p].eng.reduce((a,k)=>a+(isNum(x[k])?x[k]:0),0);
  if(isNum(x.views)&&x.views>0&&PLAT[p].eng.some(k=>isNum(x[k])))x.er=eng/x.views*100;
  return x;
}
function viewRep(){
  const cl=activeClients(); if(!cl.length)return needClients();
  const m=S.month,pm=madd(m,-1);
  let h='<section class="sec"><div class="sec-h"><h2>月次レポート</h2><div class="filters"><select id="rep-client" data-act="repClient" aria-label="クライアント">'+[['','全クライアント比較']].concat(clientOptions()).map(([v,l])=>'<option value="'+esc(v)+'"'+(v===S.repClient?' selected':'')+'>'+esc(l)+'</option>').join('')+'</select>'+(S.repClient?'<button class="primary" data-act="editMetrics" data-id="'+S.repClient+'">'+mshort(m)+'の数値を入力</button><button data-act="copyRep">報告文をコピー</button>':'')+'</div></div>';
  if(!S.repClient){
    h+='<p class="hint" style="margin:0">'+mlabel(m)+'の数値と、前月（'+mlabel(pm)+'）との比較です。クライアント名を押すと詳しいレポートを開きます。</p><div class="scroll"><table><thead><tr><th>クライアント</th><th>入力</th>'
      +Object.entries(PLAT).map(([p,d])=>'<th class="r"><span class="pf '+p+'">'+p.toUpperCase()+'</span>'+(p==='yt'?'登録者':'フォロワー')+'</th><th class="r">'+'再生数'+'</th>').join('')+'</tr></thead><tbody>'
      +cl.map(c=>{const d=metricsFor(c.id,m),pd=metricsFor(c.id,pm);
        return'<tr><td><button class="ghost" style="padding:0;font-weight:700" data-act="openRep" data-id="'+c.id+'">'+esc(c.name)+'</button></td><td>'+(d?'<span class="chip good">済</span>':'<button class="chip warn" data-act="editMetrics" data-id="'+c.id+'" style="background:none">未入力</button>')+'</td>'
        +Object.keys(PLAT).map(p=>{const a=d&&d[p]||{},b=pd&&pd[p]||{};return'<td class="r num">'+fmt(a.followers)+'<div style="font-size:11px">'+(isNum(a.followers)?deltaHtml(a.followers,b.followers):'')+'</div></td><td class="r num">'+fmt(a.views)+'<div style="font-size:11px">'+(isNum(a.views)?deltaHtml(a.views,b.views):'')+'</div></td>'}).join('')+'</tr>'}).join('')
      +'</tbody></table></div></section>';
    return h;
  }
  const c=cById(S.repClient); if(!c){S.repClient='';return viewRep()}
  const d=metricsFor(c.id,m),pd=metricsFor(c.id,pm);
  h+='</section><section class="panel sec" id="report"><div class="rep-head"><div><div class="hint">SNS運用 月次レポート</div><div class="ttl">'+esc(c.name)+' 様 ／ '+mlabel(m)+'</div></div><div class="meta">比較対象：'+mlabel(pm)+' ・ '+planChip(c)+'</div></div>';
  if(!d){h+='<div class="empty"><b>'+mlabel(m)+'の数値がまだ入っていません</b><span>各SNSのインサイト画面の数字を入力すると、前月との比較・1本あたりの成果・推移グラフが自動で作られます。</span><button class="primary" data-act="editMetrics" data-id="'+c.id+'">数値を入力</button></div></section>';return h}
  // headline summary
  const sumF=followersTotal(c.id,m),sumPF=followersTotal(c.id,pm);
  const sumV=Object.keys(PLAT).reduce((a,p)=>a+((d[p]&&isNum(d[p].views))?d[p].views:0),0);
  const sumPV=pd?Object.keys(PLAT).reduce((a,p)=>a+((pd[p]&&isNum(pd[p].views))?pd[p].views:0),0):null;
  const posts=Object.keys(PLAT).reduce((a,p)=>{const x=platMetrics(d,p,c.id,m);return a+(x&&isNum(x.posts)?x.posts:0)},0);
  const pposts=pd?Object.keys(PLAT).reduce((a,p)=>{const x=platMetrics(pd,p,c.id,pm);return a+(x&&isNum(x.posts)?x.posts:0)},0):null;
  h+='<div class="tiles">'
    +'<div class="tile"><span class="lbl">フォロワー合計（3媒体）</span><span class="val">'+fmt(sumF)+'</span><span class="sub num">'+deltaHtml(sumF,sumPF)+'</span></div>'
    +'<div class="tile"><span class="lbl">総再生数</span><span class="val">'+fmt(sumV)+'</span><span class="sub num">'+deltaHtml(sumV,sumPV||null)+'</span></div>'
    +'<div class="tile"><span class="lbl">投稿本数</span><span class="val">'+fmt(posts)+'</span><span class="sub num">'+deltaHtml(posts,pposts)+'</span></div>'
    +'<div class="tile"><span class="lbl">1本あたり再生数</span><span class="val">'+fmt(posts?sumV/posts:null)+'</span><span class="sub num">'+deltaHtml(posts?sumV/posts:null,pposts?sumPV/pposts:null)+'</span></div></div>';
  for(const [p,def] of Object.entries(PLAT)){
    const x=platMetrics(d,p,c.id,m); if(!x||!Object.keys(d[p]).length)continue;
    const y=platMetrics(pd,p,c.id,pm)||{};
    const pp=metricsFor(c.id,madd(pm,-1));const gainPrev=(isNum(y.followers)&&pp&&pp[p]&&isNum(pp[p].followers))?y.followers-pp[p].followers:null;
    const gain=isNum(x.followers)&&isNum(y.followers)?x.followers-y.followers:null;
    const kp=[];
    kp.push({l:def.fields[0][1],v:x.followers,pv:y.followers,key:1});
    kp.push({l:'今月の増加数',v:gain,pv:gainPrev,signed:1,key:1});
    for(const [k,l] of def.fields.slice(1))kp.push({l:l,v:x[k],pv:y[k],dp:k==='watchHours'?1:0});
    kp.push({l:'1本あたり再生',v:x.vpp,pv:y.vpp,key:1});
    kp.push({l:'1本あたりいいね',v:x.lpp,pv:y.lpp});
    kp.push({l:'エンゲージメント率',v:x.er,pv:y.er,dp:2,pct:1});
    h+='<div class="plat"><div class="plat-h"><span class="dot" style="background:var(--'+p+')"></span><h3>'+def.name+'</h3>'+(c[p]?'<span class="hint">'+esc(c[p])+'</span>':'')+'</div><div class="plat-body"><div class="kpis">'
      +kp.filter(k=>isNum(k.v)).map(k=>'<div class="kpi'+(k.key?' key-kpi':'')+'"><span class="lbl">'+esc(k.l)+'</span><span class="v">'+(k.signed&&k.v>0?'+':'')+fmt(k.v,k.dp)+(k.pct?'<small style="font-size:13px">%</small>':'')+'</span><span class="cmp">'+deltaHtml(k.v,k.pv,{dp:k.dp,pct:k.pct})+'</span><span class="prev">前月 '+(isNum(k.pv)?(k.signed&&k.pv>0?'+':'')+fmt(k.pv,k.dp)+(k.pct?'%':''):'—')+'</span></div>').join('')
      +'</div>'+trendSvg(c.id,p,m)+'</div></div>';
  }
  if(d.note)h+='<div class="sec"><h3>所感・来月の施策</h3><div class="note">'+esc(d.note)+'</div></div>';
  h+='<p class="hint" style="margin:0">エンゲージメント率＝（いいね＋コメント＋保存/シェア）÷ 再生数。1本あたり＝月の数値 ÷ 投稿本数。</p></section>';
  return h;
}
function reportText(){
  const c=cById(S.repClient);const m=S.month,pm=madd(m,-1);const d=metricsFor(c.id,m),pd=metricsFor(c.id,pm);
  if(!d)return null;
  const line=(l,v,pv,dp)=>{if(!isNum(v))return null;let s=l+'：'+fmt(v,dp);if(isNum(pv)){const df=v-pv;s+='（前月比 '+(df>=0?'+':'')+fmt(df,dp)+(pv?(' / '+(df>=0?'+':'')+fmt(df/Math.abs(pv)*100,1)+'%'):'')+'）'}return s};
  let t='【'+mlabel(m)+' SNS運用レポート】\n'+c.name+' 様\n';
  for(const [p,def] of Object.entries(PLAT)){const x=platMetrics(d,p,c.id,m);if(!x||!Object.keys(d[p]).length)continue;const y=platMetrics(pd,p,c.id,pm)||{};
    t+='\n■'+def.name+'\n'+[line(def.fields[0][1],x.followers,y.followers)].concat(def.fields.slice(1).map(([k,l])=>line(l,x[k],y[k],k==='watchHours'?1:0)),[line('1本あたり再生',x.vpp,y.vpp)]).filter(Boolean).join('\n')+'\n'}
  if(d.note)t+='\n■所感・来月の施策\n'+d.note+'\n';
  return t;
}

function viewCli(){
  const all=S.clients.slice().sort((a,b)=>(b.active!==false)-(a.active!==false)||(a.name||'').localeCompare(b.name||'','ja'));
  let h='<section class="sec"><div class="sec-h"><h2>クライアント</h2><button class="primary" data-act="addClient">＋ クライアントを追加</button></div>';
  if(!all.length)return h+'<div class="panel empty"><b>まだ登録がありません</b><span>運用中の取引先を追加してください。</span></div></section>';
  h+='<div class="scroll"><table><thead><tr><th>クライアント</th><th>プラン</th><th class="r">月の本数</th><th>運用開始</th><th>残り期間</th><th>アカウント</th><th>状態</th><th></th></tr></thead><tbody>'
    +all.map(c=>{const q=quota(c);let rest='—';if(c.startMonth){const end=madd(c.startMonth,6);const [ey,em]=end.split('-').map(Number),[ty,tm]=ymOf(TODAY).split('-').map(Number);const left=(ey-ty)*12+(em-tm);rest=left>0?'あと'+left+'ヶ月（'+mlabel(madd(end,-1))+'まで）':'<span class="chip warn">6ヶ月経過</span>'}
      return'<tr><td><b>'+esc(c.name)+'</b></td><td>'+planChip(c)+'</td><td class="r num">ショート'+q.short+' ／ YT'+q.long+'</td><td>'+(c.startMonth?mlabel(c.startMonth):'—')+'</td><td>'+rest+'</td><td>'+['ig','tt','yt'].filter(p=>c[p]).map(p=>'<span class="pf '+p+'">'+p.toUpperCase()+'</span>'+esc(c[p])).join(' ')+'</td><td>'+(c.active===false?'<span class="chip muted">停止</span>':'<span class="chip good">運用中</span>')+'</td><td><button class="ghost" data-act="editClient" data-id="'+c.id+'">編集</button></td></tr>'}).join('')
    +'</tbody></table></div></section>';
  return h;
}

/* ---------- render ---------- */
const VIEWS={dash:viewDash,prod:viewProd,cal:viewCal,ed:viewEd,rep:viewRep,cli:viewCli};
function render(){
  document.getElementById('mlabel').textContent=mlabel(S.month);
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===S.tab)));
  const main=document.getElementById('main');
  if(S.dbState==='none'){main.innerHTML='<div class="notice">この画面ではデータの保存・共有が使えません。claude.ai にサインインした状態で開くと、チーム全員で同じデータを見られます。</div>';return}
  if(S.loaded<4){main.innerHTML='<div class="empty"><b>読み込み中…</b></div>';return}
  main.innerHTML=(VIEWS[S.tab]||viewDash)();
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act],[data-tab]');if(!t)return;
  if(t.dataset.tab){S.tab=t.dataset.tab;try{localStorage.setItem('vh.tab',S.tab)}catch(_){}render();window.scrollTo(0,0);return}
  const a=t.dataset.act,id=t.dataset.id;
  if(a==='ovclose'&&e.target===t){closeModal();return}
  if(t.tagName==='BUTTON')e.preventDefault();
  switch(a){
    case'mprev':S.month=madd(S.month,-1);render();break;
    case'mnext':S.month=madd(S.month,1);render();break;
    case'mnow':S.month=ymOf(TODAY);render();break;
    case'mclose':closeModal();break;
    case'msave':if(modalSave){t.disabled=true;await modalSave();t.disabled=false}break;
    case'mdel':if(t.dataset.armed==='1'){modalDel&&await modalDel()}else{t.dataset.armed='1';t.textContent='もう一度押すと削除';setTimeout(()=>{if(t.isConnected){t.dataset.armed='';t.textContent='削除'}},3500)}break;
    case'addVideo':editVideo();break;
    case'editVideo':editVideo(S.videos.find(v=>v.id===id));break;
    case'addShoot':editShoot();break;
    case'editShoot':editShoot(S.shoots.find(s=>s.id===id));break;
    case'addClient':editClient();break;
    case'editClient':editClient(cById(id));break;
    case'editMetrics':editMetrics(id,S.month);break;
    case'openRep':S.repClient=id;S.tab='rep';try{localStorage.setItem('vh.rep',id);localStorage.setItem('vh.tab','rep')}catch(_){}render();window.scrollTo(0,0);break;
    case'edFilter':S.f.editor=t.dataset.name;S.f.scope='month';S.tab='prod';render();break;
    case'copyRep':{const txt=reportText();if(!txt){toast('先に数値を入力してください');break}
      try{await navigator.clipboard.writeText(txt);toast('LINE・メールに貼れる報告文をコピーしました')}
      catch(_){openModal('報告文',field({k:'txt',label:'全選択してコピーしてください',type:'textarea',v:txt,rows:14}),async()=>closeModal());const ta=document.getElementById('f_txt');ta.focus();ta.select()}
      break}
  }
});
document.addEventListener('change',async e=>{
  const t=e.target;const a=t.dataset&&t.dataset.act;if(!a)return;
  if(a==='filt'){S.f[t.dataset.k]=t.type==='checkbox'?t.checked:t.value;render()}
  else if(a==='calClient'){S.calClient=t.value;render()}
  else if(a==='repClient'){S.repClient=t.value;try{localStorage.setItem('vh.rep',t.value)}catch(_){}render()}
  else if(a==='status'){t.dataset.s=t.value;if(await upd('videos',t.dataset.id,{status:t.value,updatedAt:new Date().toISOString()}))toast('ステータスを「'+t.value+'」にしました')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalSave)closeModal()});

/* ---------- boot ---------- */
render();
(async()=>{
  const db=window.claude&&window.claude.use?await window.claude.use('db'):null;
  if(!db){S.dbState='none';render();return}
  S.db=db;
  const sub=(col,key)=>db.collection(col).onSnapshot(snap=>{S[key]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));if(!S['_'+key]){S['_'+key]=1;S.loaded++}if(!document.querySelector('.ov'))render()},err=>{toast('データの同期が止まりました。ページを開き直してください')});
  sub('clients','clients');sub('videos','videos');sub('shoots','shoots');sub('metrics','metrics');
})();
})();
</script>
