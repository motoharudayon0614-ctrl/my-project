<title>SNS運用 動画管理基盤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Barlow+Semi+Condensed:wght@500;600&display=swap">
<style>
/* Layout: sticky header with month stepper + tabs; each tab is a scannable work surface (summary first, detail below). */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --sunk:#eaeef3; --ink:#17283b; --muted:#5a6a7c; --line:#d9e0e8;
  --accent:#22405f; --accent-ink:#ffffff; --basic:#c96f22; --pro:#d0312a;
  --good:#1d8656; --warn:#a87400; --bad:#c3372d;
  --ig:#c13584; --tt:#0e8f8f; --yt:#d92323; --yts:#ef5350; --ytl:#9b1c1c; --shoot:#6a4fc9; --due:#c96f22; --post:#1f72bd;
  --font:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --num:"Barlow Semi Condensed","Zen Kaku Gothic New",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1620; --surface:#17212d; --sunk:#121a24; --ink:#e5ecf4; --muted:#97a6b7; --line:#2a3746;
  --accent:#8db4dc; --accent-ink:#0f1620; --basic:#e8954f; --pro:#ef5d55;
  --good:#45c08a; --warn:#e2b23a; --bad:#f06c61;
  --ig:#e46cb4; --tt:#3ccaca; --yt:#ff6060; --yts:#ff6b6b; --ytl:#ffb4a8; --shoot:#a690f2; --due:#e8954f; --post:#5eaaee; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1620; --surface:#17212d; --sunk:#121a24; --ink:#e5ecf4; --muted:#97a6b7; --line:#2a3746;
  --accent:#8db4dc; --accent-ink:#0f1620; --basic:#e8954f; --pro:#ef5d55;
  --good:#45c08a; --warn:#e2b23a; --bad:#f06c61;
  --ig:#e46cb4; --tt:#3ccaca; --yt:#ff6060; --yts:#ff6b6b; --ytl:#ffb4a8; --shoot:#a690f2; --due:#e8954f; --post:#5eaaee; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.6}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.brand{font-weight:700;font-size:16px;letter-spacing:.02em;margin-right:auto}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.08em}
.month{display:flex;align-items:center;gap:4px}
.month b{font-family:var(--num);font-size:20px;min-width:96px;text-align:center}
nav{max-width:1240px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto}
nav button{border:0;background:none;color:var(--muted);padding:10px 14px;font:inherit;font-weight:500;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
main{max-width:1240px;margin:0 auto;padding-block:20px 60px;padding-inline:16px;display:grid;gap:20px}
h2{font-size:17px;margin:0;text-wrap:balance}
h3{font-size:14px;margin:0}
.sec{display:grid;gap:12px;min-width:0}
.sec-h{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.hint{color:var(--muted);font-size:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px}
.tile .lbl{font-size:12px;color:var(--muted);letter-spacing:.04em}
.tile .val{font-family:var(--num);font-size:30px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .sub{font-size:12px;color:var(--muted)}
.tile.alert .val{color:var(--bad)}
button,.btn{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px}
button:hover{border-color:var(--muted)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.ghost{border-color:transparent;background:transparent}
.danger{color:var(--bad)}
.danger[data-armed="1"]{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.icon{padding:4px 10px;font-size:16px;line-height:1}
select,input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}
th{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.06em;background:var(--sunk);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.wrap{white-space:normal;min-width:180px}
tr.late td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid currentColor;line-height:1.6;white-space:nowrap}
.chip.basic{color:var(--basic)} .chip.pro{color:var(--pro)} .chip.custom{color:var(--muted)}
.chip.bad{color:var(--bad)} .chip.warn{color:var(--warn)} .chip.good{color:var(--good)} .chip.muted{color:var(--muted)}
.pf{display:inline-block;font-size:10px;font-weight:700;padding:0 5px;border-radius:4px;color:var(--surface);margin-right:2px}
.pf.ig{background:var(--ig)} .pf.tt{background:var(--tt)} .pf.yt{background:var(--yt)} .pf.yts{background:var(--yts)} .pf.ytl{background:var(--ytl)}
.st{font-size:12px;padding:3px 6px;border-radius:6px}
.st[data-s="投稿済"],.st[data-s="完了"],.st[data-s="格納済"]{color:var(--good);border-color:var(--good)}
.st[data-s="修正依頼"]{color:var(--bad);border-color:var(--bad)}
.st[data-s="修正中"]{color:var(--warn);border-color:var(--warn)}
.prog{display:grid;gap:3px;min-width:120px}
.prog .t{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.prog .track{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.prog .fill{height:100%;background:var(--accent)}
.prog .fill.full{background:var(--good)}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--muted)}
.alerts{display:grid;gap:6px}
.alert-row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:8px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.alert-row.bad{border-left:4px solid var(--bad)} .alert-row.warn{border-left:4px solid var(--warn)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty b{color:var(--ink);font-size:15px}
/* editors */
.ed-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ed{display:grid;gap:10px}
.ed .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ed .big{font-family:var(--num);font-size:34px;font-weight:600;line-height:1}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunk)}
.stack span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:12px}
.kv span:nth-child(even){font-family:var(--num);font-size:14px;text-align:right}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(100px,1fr));min-width:720px}
.cal .dow{font-size:11px;color:var(--muted);padding:6px 8px;background:var(--sunk);border-bottom:1px solid var(--line)}
.cal .day{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 5px;display:flex;flex-direction:column;gap:2px}
.cal .day:nth-child(7n){border-right:0}
.cal .day.out{background:var(--sunk);opacity:.55}
.cal .day.today .d{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 6px}
.cal .d{font-family:var(--num);font-size:13px;align-self:flex-start}
.ev .evs{display:block;font-size:10px;color:var(--muted);white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ev{font-size:11px;line-height:1.35;padding:1px 5px;border-radius:4px;border-left:3px solid;background:var(--sunk);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;text-align:left;border-top:0;border-right:0;border-bottom:0;width:100%}
.ev.shoot{border-color:var(--shoot)} .ev.due{border-color:var(--due)} .ev.post{border-color:var(--post)}
.ev.done{opacity:.55;text-decoration:line-through}
.picker{position:relative}
.picker summary{list-style:none;cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:6px 12px;background:var(--surface);white-space:nowrap}
.picker summary::-webkit-details-marker{display:none}
.pick-list{position:absolute;right:0;top:calc(100% + 4px);z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;min-width:220px;max-height:min(60vh,420px);overflow:auto;display:grid;gap:2px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.pick-list label{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:6px;font-size:13px;cursor:pointer}
.pick-list label:hover{background:var(--sunk)}
.pick-actions{display:flex;justify-content:flex-end;border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:2px}
.key{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.key i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.agenda{display:grid;gap:4px}
.agenda .row{display:grid;grid-template-columns:86px 1fr;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);align-items:start}
.agenda .row:last-child{border-bottom:0}
.agenda .dt{font-family:var(--num);font-size:15px}
.agenda .items{display:flex;flex-direction:column;gap:3px;min-width:0}
/* report */
.rep-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;align-items:end;border-bottom:2px solid var(--accent);padding-bottom:10px}
.rep-head .ttl{font-size:22px;font-weight:700}
.rep-head .meta{color:var(--muted);font-size:12px}
.plat{display:grid;gap:12px}
.plat-h{display:flex;align-items:center;gap:8px}
.plat-h .dot{width:12px;height:12px;border-radius:3px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:1px;min-width:0}
.kpi .lbl{font-size:11px;color:var(--muted)}
.kpi .v{font-family:var(--num);font-size:24px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .cmp{font-size:12px;font-family:var(--num);font-variant-numeric:tabular-nums}
.kpi .prev{font-size:11px;color:var(--muted)}
.kpi.key-kpi{background:var(--sunk)}
.plat-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:16px;align-items:start}
@media (max-width:820px){.plat-body{grid-template-columns:1fr}}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--num);font-size:10px}
.note{white-space:pre-wrap;background:var(--sunk);border-radius:8px;padding:12px;font-size:13px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:640px;padding:18px;display:grid;gap:14px;border:1px solid var(--line)}
.modal .mh{display:flex;justify-content:space-between;align-items:center}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.form label{display:grid;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.form label.full,.form .full{grid-column:1/-1}
.form input,.form select,.form textarea{width:100%;color:var(--ink)}
.form fieldset{grid-column:1/-1;border:1px solid var(--line);border-radius:8px;padding:8px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px 12px;margin:0}
.form legend{font-size:12px;font-weight:700;padding:0 4px;color:var(--ink)}
.checks{display:flex;gap:14px;flex-wrap:wrap;color:var(--ink)}
.checks label{display:flex;gap:4px;align-items:center;font-size:13px;color:var(--ink)}
.checks input{width:auto}
@media (max-width:520px){.form{grid-template-columns:1fr}}
.mf{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.mf .r{display:flex;gap:8px;margin-left:auto}
.toast-undo{margin-left:12px;background:transparent;color:inherit;border:1px solid currentColor;padding:2px 10px;font-size:12px;border-radius:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;z-index:60;font-size:13px}
.notice{padding:10px 14px;border-radius:8px;border:1px solid var(--warn);color:var(--ink);background:var(--surface);font-size:13px}
.cl-row td:first-child{font-weight:700}
@media (prefers-reduced-motion:no-preference){.prog .fill{transition:width .3s}}
</style>

<header>
  <div class="bar">
    <div class="brand">動画管理基盤<small>SNS運用代行 ／ 制作・撮影・投稿・レポート</small></div>
    <div class="month" aria-label="対象月">
      <button class="icon" data-act="mprev" aria-label="前の月">‹</button>
      <b id="mlabel" class="num"></b>
      <button class="icon" data-act="mnext" aria-label="次の月">›</button>
      <button data-act="mnow">今月</button>
    </div>
  </div>
  <nav role="tablist" id="tabs">
    <button role="tab" data-tab="dash">全体</button>
    <button role="tab" data-tab="prod">制作管理</button>
    <button role="tab" data-tab="cal">スケジュール</button>
    <button role="tab" data-tab="ed">編集者</button>
    <button role="tab" data-tab="rep">月次レポート</button>
    <button role="tab" data-tab="cli">クライアント</button>
  </nav>
</header>
<main id="main"><div class="empty"><b>読み込み中…</b></div></main>
<div id="modal-root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function(){
const PLAT={
  ig:{name:'Instagram',fields:[['followers','フォロワー数'],['posts','投稿本数'],['views','再生数'],['reach','リーチ'],['likes','いいね'],['comments','コメント'],['saves','保存']],eng:['likes','comments','saves']},
  tt:{name:'TikTok',fields:[['followers','フォロワー数'],['posts','投稿本数'],['views','再生数'],['likes','いいね'],['comments','コメント'],['shares','シェア'],['saves','保存']],eng:['likes','comments','shares','saves']},
  yt:{name:'YouTube',fields:[['followers','チャンネル登録者'],['posts','投稿本数'],['views','再生回数'],['watchHours','総再生時間(時間)'],['likes','高評価'],['comments','コメント']],eng:['likes','comments']}
};
const RP={ig:PLAT.ig,tt:PLAT.tt,yt:PLAT.yt,
  yts:{name:'YouTube ショート',base:'yt',kind:'short',fields:[['followers','チャンネル登録者（共通）']].concat(PLAT.yt.fields.slice(1).filter(f=>f[0]!=='watchHours')),eng:PLAT.yt.eng},
  ytl:{name:'YouTube 横動画',base:'yt',kind:'long',fields:[['followers','チャンネル登録者（共通）']].concat(PLAT.yt.fields.slice(1)),eng:PLAT.yt.eng}};
const baseOf=p=>RP[p]&&RP[p].base||p;
const rkey=v=>v.platform==='yt'?((v.kind||'long')==='short'?'yts':'ytl'):v.platform;
const STATUSES=['指名','制作中','質問中','回答済み','修正依頼','納品済','クライアント確認','完了','格納済','投稿済','企画','撮影待ち','編集中','確認中','修正中'];
const ST_COLOR={'指名':'var(--muted)','制作中':'var(--post)','質問中':'var(--warn)','回答済み':'var(--post)','修正依頼':'var(--bad)','納品済':'var(--accent)','クライアント確認':'var(--shoot)','完了':'var(--good)','格納済':'var(--good)','投稿済':'var(--good)',
  '企画':'var(--muted)','撮影待ち':'var(--shoot)','編集中':'var(--post)','確認中':'var(--accent)','修正中':'var(--warn)'};
const DONE=new Set(['納品済','クライアント確認','完了','格納済','投稿済']);
const usedStatuses=list=>STATUSES.filter(st=>list.some(v=>v.status===st)).concat([...new Set(list.map(v=>v.status))].filter(st=>st&&!STATUSES.includes(st)));
const TYPES={short:'ショート',long:'YouTube(横)'};
const PLANS={basic:{label:'BASIC',short:4,long:1},pro:{label:'PRO',short:4,long:4},custom:{label:'カスタム',short:0,long:0}};

const pad=n=>String(n).padStart(2,'0');
const today=new Date(); const TODAY=today.getFullYear()+'-'+pad(today.getMonth()+1)+'-'+pad(today.getDate());
const ymOf=d=>d.slice(0,7);
const madd=(m,n)=>{const [y,mo]=m.split('-').map(Number);const d=new Date(y,mo-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const mlabel=m=>{const [y,mo]=m.split('-');return y+'年'+Number(mo)+'月'};
const mshort=m=>Number(m.split('-')[1])+'月';
const dadd=(d,n)=>{const [y,m,dd]=d.split('-').map(Number);const x=new Date(y,m-1,dd+n);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate())};
const dlabel=d=>{if(!d)return'—';const [y,m,dd]=d.split('-').map(Number);const w='日月火水木金土'[new Date(y,m-1,dd).getDay()];return m+'/'+dd+'('+w+')'};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isNum=v=>typeof v==='number'&&isFinite(v);
const fmt=(n,dp)=>isNum(n)?n.toLocaleString('ja-JP',{maximumFractionDigits:dp==null?0:dp,minimumFractionDigits:dp||0}):'—';

const S={tab:'dash',month:ymOf(TODAY),clients:[],videos:[],shoots:[],metrics:[],settings:[],gcal:[],trash:[],db:null,loaded:0,
  f:{client:'',editor:'',status:'',scope:'month',hideDone:false},calClient:'',repClient:''};
try{S.payBasis=localStorage.getItem('vh.pay')||'stored';S.calClients=JSON.parse(localStorage.getItem('vh.cal')||'[]');const t=localStorage.getItem('vh.tab');if(t)S.tab=t;const rc=localStorage.getItem('vh.rep');if(rc)S.repClient=rc}catch(e){}

const cById=id=>S.clients.find(c=>c.id===id);
const cName=id=>{const c=cById(id);return c?c.name:'(削除済み)'};
const activeClients=()=>S.clients.filter(c=>c.active!==false).sort((a,b)=>(a.name||'').localeCompare(b.name||'','ja'));
const quota=(c,m)=>{m=m||S.month;const p=PLANS[c.plan]||PLANS.custom;let q={short:isNum(c.shortQuota)?c.shortQuota:p.short,long:isNum(c.longQuota)?c.longQuota:p.long};
  const hist=(c.quotaHistory||[]).filter(h=>h.from<=m).sort((a,b)=>a.from.localeCompare(b.from)).pop();if(hist)q={short:hist.short,long:hist.long};
  const one=(c.quotaMonths||{})[m];if(one)q={short:one.short,long:one.long,oneMonth:true};return q};
const isLate=v=>v.dueDate&&v.dueDate<TODAY&&!DONE.has(v.status);
const metricsFor=(cid,m)=>S.metrics.find(x=>x.clientId===cid&&x.month===m);

function deltaHtml(cur,prev,opts){
  opts=opts||{};
  if(!isNum(cur)||!isNum(prev))return'<span class="flat">前月データなし</span>';
  const d=cur-prev; const cls=d>0?'up':d<0?'down':'flat'; const arrow=d>0?'▲':d<0?'▼':'±';
  const pct=prev!==0?(d/Math.abs(prev)*100):null;
  const ds=opts.pct?(d>0?'+':'')+fmt(d,1)+'pt':(d>0?'+':'')+fmt(d,opts.dp);
  return'<span class="'+cls+'">'+arrow+' '+ds+(pct!=null&&!opts.pct?' ('+(pct>0?'+':'')+fmt(pct,1)+'%)':'')+'</span>';
}

let toastT;
function toast(msg,undoId){let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}
  el.textContent=msg;if(undoId){const b=document.createElement('button');b.className='toast-undo';b.dataset.act='restore';b.dataset.id=undoId;b.textContent='元に戻す';el.appendChild(b)}
  el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},undoId?8000:2600)}
let modalSave=null,modalDel=null;
function openModal(title,fieldsHtml,onSave,onDel){

function closeModal(){document.getElementById('modal-root').innerHTML='';modalSave=modalDel=null;render()}
function field(o){
  const id='f_'+o.k; const v=o.v==null?'':o.v; const cls=o.full?' class="full"':'';
  if(o.type==='select')return'<label'+cls+'>'+esc(o.label)+'<select id="'+id+'" name="'+o.k+'">'+o.options.map(([val,l])=>'<option value="'+esc(val)+'"'+(String(val)===String(v)?' selected':'')+'>'+esc(l)+'</option>').join('')+'</select></label>';
  if(o.type==='textarea')return'<label class="full">'+esc(o.label)+'<textarea id="'+id+'" name="'+o.k+'" rows="'+(o.rows||3)+'">'+esc(v)+'</textarea></label>';
  if(o.type==='checks')return'<div class="full"><div class="hint" style="margin-bottom:3px">'+esc(o.label)+'</div><div class="checks">'+o.options.map(([val,l])=>'<label><input type="checkbox" name="'+o.k+'" value="'+esc(val)+'"'+((v||[]).includes(val)?' checked':'')+'>'+esc(l)+'</label>').join('')+'</div></div>';
  return'<label'+cls+'>'+esc(o.label)+'<input id="'+id+'" name="'+o.k+'" type="'+(o.type||'text')+'" value="'+esc(v)+'"'+(o.list?' list="'+o.list+'"':'')+(o.ph?' placeholder="'+esc(o.ph)+'"':'')+(o.type==='number'?' inputmode="decimal" step="any"':'')+'></label>';
}
function formVals(){
  const f=document.getElementById('mform');const out={};
  f.querySelectorAll('input,select,textarea').forEach(el=>{
    if(!el.name)return;
    if(el.type==='checkbox'){(out[el.name]=out[el.name]||[]);if(el.checked)out[el.name].push(el.value);return}
    if(el.type==='number'){out[el.name]=el.value===''?null:Number(el.value);return}
    out[el.name]=el.value.trim();
  });
  return out;
}

/* ---------- db ---------- */
async function save(col,id,data){
  if(!S.db){toast('この表示では保存できません');return false}
  try{data.updatedAt=new Date().toISOString();if(id)await S.db.collection(col).doc(id).set(data);else await S.db.collection(col).add(data);return true}
  catch(e){toast(e&&e.code==='invalid_argument'?'保存する権限がありません（閲覧のみの共有です）':'保存できませんでした。もう一度お試しください');return false}
}
async function upd(col,id,data){try{await S.db.collection(col).doc(id).update(data);return true}catch(e){toast('更新できませんでした');return false}}
const TRASH_DAYS=30;
function trashLabel(col,d){return col==='videos'?'動画：'+(d.title||'')+'（'+cName(d.clientId)+'）':col==='shoots'?'撮影：'+cName(d.clientId)+' '+dlabel(d.date):col==='clients'?'クライアント：'+(d.name||''):col}
async function del(col,id){
  const cur=(S[col]||[]).find(x=>x.id===id);let tid=null;
  try{
    if(cur){const data=Object.assign({},cur);delete data.id;const ref=S.db.collection('trash').doc();tid=ref.id;
      await ref.set({col,docId:id,data,label:trashLabel(col,cur),deletedAt:new Date().toISOString()})}
    await S.db.collection(col).doc(id).delete();S.lastTrash=tid;return true
  }catch(e){toast('削除できませんでした');return false}
}
async function restore(tid){
  const t=S.trash.find(x=>x.id===tid);if(!t){toast('この項目はもう戻せません');return}
  try{await S.db.collection(t.col).doc(t.docId).set(t.data);await S.db.collection('trash').doc(tid).delete();toast('元に戻しました：'+t.label);if(t.col==='shoots')setTimeout(()=>syncGcal(false),800)}
  catch(e){toast('元に戻せませんでした（編集権限が必要です）')}
}
async function pruneTrash(){const lim=Date.now()-TRASH_DAYS*864e5;for(const t of S.trash)if(new Date(t.deletedAt||0).getTime()<lim){try{await S.db.collection('trash').doc(t.id).delete()}catch(_){return}}}
function trashHtml(){
  const items=S.trash.slice().sort((a,b)=>(b.deletedAt||'').localeCompare(a.deletedAt||''));
  return'<section class="sec"><div class="sec-h"><h2>削除した項目</h2><span class="hint">削除から'+TRASH_DAYS+'日間は元に戻せます</span></div>'
    +(items.length?'<div class="scroll"><table><thead><tr><th>削除したもの</th><th>削除日時</th><th></th></tr></thead><tbody>'
      +items.map(t=>'<tr><td class="wrap">'+esc(t.label||t.col)+'</td><td class="num">'+(t.deletedAt?dlabel(t.deletedAt.slice(0,10))+' '+new Date(t.deletedAt).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}):'—')+'</td><td><button data-act="restore" data-id="'+t.id+'">元に戻す</button></td></tr>').join('')
      +'</tbody></table></div>':'<div class="panel empty"><span>削除した動画・撮影予定・クライアントはここに表示され、元に戻せます。</span></div>')+'</section>';
}

function progBar(label,done,total){

  return'<div class="prog"><div class="t"><span>'+label+'</span><span class="num">'+done+' / '+total+'</span></div><div class="track"><div class="fill'+(total&&done>=total?' full':'')+'" style="width:'+pct+'%"></div></div></div>';

      +soon.map(v=>'<div class="alert-row warn"><span class="chip warn">納期 '+dlabel(v.dueDate)+'</span><b>'+esc(v.title)+'</b><span class="hint">'+esc(cName(v.clientId))+' ・ '+esc(v.editor||'担当未定')+' ・ '+esc(v.status)+'</span><button class="ghost" data-act="editVideo" data-id="'+v.id+'">開く</button></div>').join('')

function viewProd(){

/* ---------- 編集者への報酬（請求金額） ---------- */
/* Which month a finished video is paid in: its 格納日, else its 納期 (basis 'stored'), or always its 納期 (basis 'due'). */
const payMonth=v=>S.payBasis==='due'?ymOf(v.dueDate||'0000-00'):ymOf(v.storedDate||v.dueDate||'0000-00');
const edKey=v=>(v.editor||'').trim()||'担当未定';
function payRows(m){
  const done=S.videos.filter(v=>DONE.has(v.status)&&payMonth(v)===m);
  const open=S.videos.filter(v=>!DONE.has(v.status)&&(v.dueDate||'').startsWith(m));
  const names=[...new Set(done.concat(open).map(edKey))].sort((a,b)=>a==='担当未定'?1:b==='担当未定'?-1:a.localeCompare(b,'ja'));
  const sum=a=>a.reduce((t,v)=>t+(isNum(v.price)?v.price:0),0);
  return names.map(n=>{const d=done.filter(v=>edKey(v)===n),o=open.filter(v=>edKey(v)===n);
    return{name:n,done:d,open:o,doneYen:sum(d),openYen:sum(o),noPrice:d.concat(o).filter(v=>!isNum(v.price)).length}});
}
function payHtml(m){
  const rows=payRows(m);
  const basisSel='<select id="pay-basis" data-act="payBasis" aria-label="計上の基準"><option value="stored"'+(S.payBasis!=='due'?' selected':'')+'>格納日で計上（なければ納期）</option><option value="due"'+(S.payBasis==='due'?' selected':'')+'>納期で計上</option></select>';
  let h='<section class="sec"><div class="sec-h"><h2>'+mlabel(m)+'の報酬（請求金額）</h2><div class="filters">'+basisSel+(S.dl&&rows.length?'<button data-act="payCsv">CSVで保存</button>':'')+'</div></div>';
  if(!rows.length)return h+'<div class="panel empty"><b>'+mlabel(m)+'に計上する案件はありません</b><span>制作管理シートの「単価」「格納日」「ステータス」から自動で集計します。</span></div></section>';
  const T={d:0,dy:0,o:0,oy:0,np:0};rows.forEach(r=>{T.d+=r.done.length;T.dy+=r.doneYen;T.o+=r.open.length;T.oy+=r.openYen;T.np+=r.noPrice});
  h+='<div class="tiles"><div class="tile"><span class="lbl">確定した報酬の合計</span><span class="val">¥'+fmt(T.dy)+'</span><span class="sub">'+T.d+'本（完了・格納済など）</span></div>'
    +'<div class="tile"><span class="lbl">進行中の見込み</span><span class="val">¥'+fmt(T.oy)+'</span><span class="sub">'+T.o+'本（納期が'+mshort(m)+'で未完了）</span></div>'

  h+='<div class="scroll"><table><thead><tr><th>編集者</th><th class="r">確定本数</th><th class="r">請求金額（確定）</th><th class="r">進行中</th><th class="r">見込み</th><th>単価未入力</th><th></th></tr></thead><tbody>'
    +rows.map((r,i)=>'<tr><td><b>'+esc(r.name)+'</b></td><td class="r num">'+r.done.length+'</td><td class="r num"><b>¥'+fmt(r.doneYen)+'</b></td><td class="r num">'+r.open.length+'</td><td class="r num">¥'+fmt(r.openYen)+'</td><td>'+(r.noPrice?'<span class="chip warn">'+r.noPrice+'件</span>':'<span class="hint">—</span>')+'</td><td><button class="ghost" data-act="payOpen" data-k="'+i+'">'+(S.payOpen===i?'閉じる':'明細')+'</button></td></tr>'
      +(S.payOpen===i?'<tr><td colspan="7" style="white-space:normal;background:var(--sunk)"><table><thead><tr><th>案件名</th><th>クライアント</th><th>状態</th><th>格納日</th><th>納期</th><th class="r">単価</th></tr></thead><tbody>'
        +r.done.concat(r.open).map(v=>'<tr><td class="wrap">'+esc(v.title)+'</td><td>'+esc(cName(v.clientId))+'</td><td>'+esc(v.status)+(DONE.has(v.status)?'':' <span class="hint">（見込み）</span>')+'</td><td class="num">'+dlabel(v.storedDate)+'</td><td class="num">'+dlabel(v.dueDate)+'</td><td class="r num">'+(isNum(v.price)?'¥'+fmt(v.price):'<span class="chip warn">未入力</span>')+'</td></tr>').join('')
        +'</tbody></table></td></tr>':'')).join('')
    +'<tr><td><b>合計</b></td><td class="r num">'+T.d+'</td><td class="r num"><b>¥'+fmt(T.dy)+'</b></td><td class="r num">'+T.o+'</td><td class="r num">¥'+fmt(T.oy)+'</td><td></td><td></td></tr>'
    +'</tbody></table></div><p class="hint" style="margin:0">確定＝ステータスが納品済・クライアント確認・完了・格納済の案件。金額はシートの「単価」の数字（「3000円（指名UP）」は3,000円）。</p></section>';
  return h;
}
async function payCsv(){
  const m=S.month;const lines=[['編集者','案件名','クライアント','ステータス','区分','格納日','納期','単価']];
  payRows(m).forEach(r=>r.done.concat(r.open).forEach(v=>lines.push([r.name,v.title,cName(v.clientId),v.status,DONE.has(v.status)?'確定':'見込み',v.storedDate||'',v.dueDate||'',isNum(v.price)?v.price:''])));

  await saveFile('編集者報酬_'+m.replace('-','年')+'月.csv',csv);
}

function calEvents(){
  const ev=[];const sel=new Set(S.calClients||[]);const cf=sel.size?{has:id=>sel.has(id)}:null;
  S.shoots.forEach(s=>{if(cf&&!cf.has(s.clientId))return;ev.push({d:s.date,k:'shoot',t:'撮影 '+cName(s.clientId)+(s.time?' '+s.time:''),sub:[s.place,s.people?s.people+'名':'',s.memo].filter(Boolean).join(' ・ '),id:s.id,act:'editShoot'})});
  S.videos.forEach(v=>{if(cf&&!cf.has(v.clientId))return;
    if(v.dueDate)ev.push({d:v.dueDate,k:'due',t:'納期 '+cName(v.clientId)+'｜'+v.title,sub:(v.editor||'担当未定')+' ・ '+v.status,id:v.id,act:'editVideo',done:DONE.has(v.status),late:isLate(v)});

}

  return h;
}

function trendSvg(cid,p,m){
  const months=[...Array(6)].map((_,i)=>madd(m,i-5));
  const rows=months.map(x=>{const t=platMetrics(metricsFor(cid,x),p,cid,x)||{};return{m:x,f:isNum(t.followers)?t.followers:null,v:isNum(t.views)?t.views:null}});
  if(rows.filter(r=>isNum(r.f)||isNum(r.v)).length<2)return'<div class="hint" style="padding:12px 0">2ヶ月分以上入力すると推移グラフが出ます。</div>';
  const W=340,H=170,L=8,R=8,T=26,B=22,iw=W-L-R,ih=H-T-B,bw=iw/6;
  const vmax=Math.max(1,...rows.map(r=>isNum(r.v)?r.v:0));
  const fs=rows.filter(r=>isNum(r.f)).map(r=>r.f);let fmin=Math.min(...fs),fmax=Math.max(...fs);if(fmin===fmax){fmin-=1;fmax+=1}const padF=(fmax-fmin)*.15;fmin-=padF;fmax+=padF;
  const col='var(--'+p+')';
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+RP[p].name+'の6ヶ月推移">';
  for(let g=0;g<=2;g++){const y=T+ih*g/2;s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" style="stroke:var(--line)" stroke-width="1"/>'}
  rows.forEach((r,i)=>{const x=L+bw*i;if(isNum(r.v)){const bh=r.v/vmax*ih;s+='<rect x="'+(x+bw*.22)+'" y="'+(T+ih-bh)+'" width="'+(bw*.56)+'" height="'+bh+'" rx="2" style="fill:'+col+';opacity:.22"/>'}s+='<text x="'+(x+bw/2)+'" y="'+(H-6)+'" text-anchor="middle" style="fill:var(--muted)">'+mshort(r.m)+'</text>'});
  const pts=rows.map((r,i)=>isNum(r.f)?[L+bw*i+bw/2,T+ih-(r.f-fmin)/(fmax-fmin)*ih,r.f]:null).filter(Boolean);
  if(pts.length>1)s+='<polyline points="'+pts.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')+'" style="fill:none;stroke:'+col+'" stroke-width="2.2" stroke-linejoin="round"/>';
  pts.forEach((q,i)=>{const last=i===pts.length-1;s+='<circle cx="'+q[0]+'" cy="'+q[1]+'" r="'+(last?4.5:2.5)+'" style="fill:'+(last?col:'var(--surface)')+';stroke:'+col+'" stroke-width="1.6"/>';if(last)s+='<text x="'+Math.min(q[0],W-R-2)+'" y="'+(q[1]-9)+'" text-anchor="end" style="fill:var(--ink);font-weight:600;font-size:11px">'+fmt(q[2])+'</text>'});
  s+='</svg>';
  return'<div class="chart">'+s+'<div class="legend"><span><i style="background:'+col+'"></i>'+(baseOf(p)==='yt'?'登録者':'フォロワー')+'（線）</span><span><i style="background:'+col+';opacity:.3"></i>再生数（棒）</span></div></div>';

}

function parseCSV(t){
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch==='"')q=true;else if(ch===','){row.push(cell);cell=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}
    else cell+=ch}
  if(cell!==''||row.length){row.push(cell);rows.push(row)}
  return rows;
}
function decodeB64(b){try{const bin=atob(b.replace(/\s+/g,''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)}catch(e){return null}}

  const id=sheetId();if(!id){if(manual)toast('制作管理シートのURLが正しくありません（クライアントタブで設定）');return}
  const mcp=window.claude&&window.claude.use?await window.claude.use('mcp'):null;
  if(!mcp){S.sheetErr='この表示ではGoogle Driveにつなげません';if(manual)toast(S.sheetErr);render();return}
  S.syncing=true;S.sheetErr='';render();
  try{
    let res;
    try{res=await mcp.callTool('Google Drive','download_file_content',{fileId:id,exportMimeType:'text/csv'},{cache:false})}
    catch(e){
      const c=e&&e.code;
      S.sheetErr=c==='server_not_connected'?'Google Driveが未接続です。claude.aiの設定 → コネクタでGoogle Driveをつないでください。'
        :c==='needs_reauth'?'Google Driveの接続が切れています。claude.aiの設定 → コネクタでつなぎ直してください。'
        :c==='not_in_manifest'||c==='consent_required'?'このページでのGoogle Driveの利用が許可されていません。ページ右上の権限メニューから許可してください。'
        :c==='selection_required'?'Google Driveのアカウントを選んでください。'
        :c==='tool_error'?'シートを読めませんでした。シートのURLと、このGoogleアカウントで開けるかを確認してください。'
        :'シートを読み込めませんでした（'+(c||'error')+'）。少し待ってから「今すぐ同期」を押してください。';
      return;
    }
    let p=res&&res.payload;if(typeof p==='string'){try{p=JSON.parse(p)}catch(_){}}
    const raw=p&&typeof p==='object'?p.content:(typeof p==='string'?p:'');
    let text=raw&&!/案件名/.test(raw)?decodeB64(raw):raw;
    if(!text||!/案件名/.test(text)){S.sheetErr='シートの1行目に「案件名」の列が見つかりませんでした。';return}
    text=text.replace(/^﻿/,'');
    const rows=parseCSV(text);const hdr=rows[0].map(normName);const col=n=>hdr.indexOf(n);
    const C={title:col('案件名'),client:col('クライアント'),due:col('納期'),dueTalk:col('納期相談'),status:col('ステータス'),doc:col('素材/ドキュメント'),url:col('納品URL'),note:col('備考'),editor:col('編集者'),order:col('受注日'),store:col('格納URL(グーグルドライブ)'),price:col('単価'),stored:col('格納日'),post:col('投稿日')};
    if(C.store<0)C.store=hdr.findIndex(h=>h.startsWith('格納URL'));
    const g=(r,k)=>C[k]>=0?String(r[C[k]]||'').trim():'';
    // clients: match by normalised name, create the missing ones
    const byName={};S.clients.forEach(c=>{[c.name].concat(c.aliases||[]).forEach(n=>{if(n)byName[normName(n)]=c.id})});
    const newClients={};
    const seen={};const want={};
    rows.slice(1).forEach((r,i)=>{
      const title=g(r,'title'),cn=g(r,'client');if(!title&&!cn)return;
      const nk=normName(cn)||'(クライアント未記入)';
      if(!byName[nk]){const cid='cs_'+strHash(nk);byName[nk]=cid;newClients[cid]={name:cn||'(クライアント未記入)',plan:'custom',active:true,source:'sheet'}}
      const key=nk+'|'+normName(title);seen[key]=(seen[key]||0)+1;
      const vid='sh_'+strHash(key)+'_'+seen[key];
      const memo=[g(r,'dueTalk')?'納期相談: '+g(r,'dueTalk'):'',g(r,'note')].filter(Boolean).join(' ／ ');
      want[vid]={title:title||'(案件名なし)',clientId:byName[nk],status:g(r,'status')||'指名',editor:edName(g(r,'editor')),dueDate:sdate(g(r,'due')),postDate:sdate(g(r,'post')),
        orderDate:sdate(g(r,'order')),storedDate:sdate(g(r,'stored')),price:yen(g(r,'price')),url:g(r,'url'),docUrl:g(r,'doc'),storeUrl:g(r,'store'),memo:memo,sheetRow:i+2};
    });
    const cur={};S.videos.forEach(v=>{cur[v.id]=v});
    const writes=[];
    for(const [cid,c] of Object.entries(newClients))writes.push(()=>S.db.collection('clients').doc(cid).set(Object.assign({updatedAt:new Date().toISOString()},c)));
    for(const [vid,w] of Object.entries(want)){
      const old=cur[vid];
      if(old&&SHEET_FIELDS.every(k=>(old[k]??null)===(w[k]??null)))continue;
      const doc=Object.assign({type:old&&old.type||'short',platforms:old&&old.platforms||[],shootDate:old&&old.shootDate||''},w,{source:'sheet',updatedAt:new Date().toISOString()});
      writes.push(()=>S.db.collection('videos').doc(vid).set(doc));
    }
    for(const v of S.videos)if(v.source==='sheet'&&!want[v.id])writes.push(()=>S.db.collection('videos').doc(v.id).delete());
    let n=0;
    for(const w of writes){await w();n++;if(n%20===0)toast('スプレッドシートを同期中… '+n+' / '+writes.length)}
    const ms=Object.assign({},mainSettings());delete ms.id;
    await S.db.collection('settings').doc('main').set(Object.assign(ms,{sheetSyncedAt:new Date().toISOString(),sheetRows:Object.keys(want).length}));
    if(manual&&writes.length)setTimeout(()=>syncGcal(false),800);
    if(manual||writes.length)toast(writes.length?'スプレッドシートから'+writes.length+'件を更新しました':'スプレッドシートと同じ内容です');
  }catch(e){
    S.sheetErr=e&&e.code==='invalid_argument'?'このページのデータを書き換える権限がないため、同期できません。':'同期の途中で止まりました。「今すぐ同期」でもう一度試してください。';
  }finally{S.syncing=false;render()}
}
function sheetBar(){
  const ms=mainSettings();const at=ms.sheetSyncedAt;
  return'<div class="alert-row" style="border-left:4px solid var(--good)"><b>制作管理シートと連携</b><span class="hint">'
    +(S.syncing?'同期しています…':at?'最終同期 '+dlabel(at.slice(0,10))+' '+new Date(at).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})+'（'+fmt(ms.sheetRows)+'件）':'まだ同期していません')

/* ---------- 契約本数との比較 ----------
   Shorts are usually cross-posted, so the month's Shorts count is the highest count on any one of
   Instagram / TikTok / YouTube Shorts (one video posted to three apps counts once). Long-form = YouTube 横動画. */
const OPTION_PRICE={short:30000,long:50000};
function contractRows(cid,m){
  const c=cById(cid);if(!c)return[];const q=quota(c,m);const d=metricsFor(cid,m);
  const per={ig:vidsOf(d,'ig').length,tt:vidsOf(d,'tt').length,yts:vidsOf(d,'yts').length};
  const shortA=d?Math.max(per.ig,per.tt,per.yts):null, longA=d?vidsOf(d,'ytl').length:null;
  const sheet=S.videos.filter(v=>v.clientId===cid&&(v.postDate||'').startsWith(m)).length;
  return[{key:'short',label:'ショート動画',q:q.short,a:shortA,detail:'IG '+per.ig+' ／ TT '+per.tt+' ／ YTショート '+per.yts,sheet},
         {key:'long',label:'YouTube横動画',q:q.long,a:longA,detail:'YouTube横動画 '+(longA||0)+'本',sheet}].filter(r=>r.q>0||(r.a||0)>0);
}
function contractVerdict(r){
  if(!isNum(r.a))return{cls:'muted',txt:'データなし',diff:null};
  const diff=r.a-r.q;
  return diff>0?{cls:'warn',txt:'+'+diff+'本 超過',diff}:diff<0?{cls:'bad',txt:diff+'本 不足',diff}:{cls:'good',txt:'契約どおり',diff};
}

    +((c.quotaHistory||[]).length||Object.keys(c.quotaMonths||{}).length?'<div class="full hint">これまでの変更：'+(c.quotaHistory||[]).slice().sort((a,b)=>a.from.localeCompare(b.from)).map(h=>mlabel(h.from)+'〜 ショート'+h.short+'・横'+h.long).concat(Object.entries(c.quotaMonths||{}).sort().map(([mm,o])=>mlabel(mm)+'のみ ショート'+o.short+'・横'+o.long)).join(' ／ ')+'</div>':'');
  openModal('契約本数を変更',html,async()=>{
    const v=formVals();if(!isNum(v.short)||!isNum(v.long)||v.short<0||v.long<0){toast('本数を0以上の数字で入れてください');return}

    else{d.quotaHistory=(c.quotaHistory||[]).filter(h=>h.from!==m).concat([{from:m,short:v.short,long:v.long}]);
      const qm=Object.assign({},c.quotaMonths||{});delete qm[m];d.quotaMonths=qm}
    if(await save('clients',cid,d)){closeModal();toast('契約本数を更新しました')}
  },(c.quotaMonths||{})[m]||(c.quotaHistory||[]).some(h=>h.from===m)?async()=>{
    const d=Object.assign({},c);delete d.id;d.quotaHistory=(c.quotaHistory||[]).filter(h=>h.from!==m);const qm=Object.assign({},c.quotaMonths||{});delete qm[m];d.quotaMonths=qm;
    if(await save('clients',cid,d)){closeModal();toast(mlabel(m)+'の変更を取り消しました')}}:null);
}

/* ---------- Googleカレンダー連携（オーナーのGoogle Calendarコネクタで、撮影・納期・投稿日を予定として登録） ----------
   gcal/<key> keeps {eventId, sig, date} so later changes update or remove the same Google event. Past items are left alone. */
const GCAL_TYPES={shoot:'撮影',due:'納期',post:'投稿日'};
const gcalCfg=()=>Object.assign({types:{shoot:true,due:false,post:false}},mainSettings().gcal||{});
function gcalItems(){
  const cfg=gcalCfg(),from=dadd(TODAY,-1),out=[];const t=cfg.types||{};
  const hm=x=>{const m=String(x||'').normalize('NFKC').match(/(\d{1,2}):(\d{2})(?:\s*[~〜\-ー–]\s*(\d{1,2}):(\d{2}))?/);return m?{s:pad(m[1])+':'+m[2],e:m[3]?pad(m[3])+':'+m[4]:null}:null};
  if(t.shoot)S.shoots.forEach(x=>{if(!x.date||x.date<from)return;const tm=hm(x.time);
    out.push({key:'shoot_'+x.id,date:x.date,summary:'【撮影】'+cName(x.clientId),time:tm,location:x.place||'',
      description:['クライアント：'+cName(x.clientId),x.time?'時間：'+x.time:'',x.people?'人数：'+x.people+'名':'',x.memo?'内容：'+x.memo:'','動画管理基盤から自動登録'].filter(Boolean).join('\n')})});
  S.videos.forEach(v=>{
    if(t.due&&v.dueDate&&v.dueDate>=from&&!DONE.has(v.status))out.push({key:'due_'+v.id,date:v.dueDate,summary:'【納期】'+cName(v.clientId)+'｜'+v.title+(v.editor?'（'+v.editor+'）':''),
      description:['ステータス：'+(v.status||''),v.editor?'編集者：'+v.editor:'',v.docUrl?'素材：'+v.docUrl:'','動画管理基盤から自動登録'].filter(Boolean).join('\n')});
    if(t.post&&v.postDate&&v.postDate>=from)out.push({key:'post_'+v.id,date:v.postDate,summary:'【投稿】'+cName(v.clientId)+'｜'+v.title,
      description:[(v.platforms||[]).length?'投稿先：'+v.platforms.map(p=>PLAT[p]?PLAT[p].name:p).join('・'):'',v.url?'納品：'+v.url:'','動画管理基盤から自動登録'].filter(Boolean).join('\n')});
  });
  return out;
}
function gcalInput(it){
  const base={summary:it.summary,description:it.description,location:it.location||'',timeZone:'Asia/Tokyo',notificationLevel:'NONE'};
  if(it.time){const e=it.time.e||(()=>{const [h,mi]=it.time.s.split(':').map(Number);return pad(Math.min(h+1,23))+':'+pad(mi)})();
    return Object.assign(base,{startTime:it.date+'T'+it.time.s+':00+09:00',endTime:it.date+'T'+e+':00+09:00'})}
  return Object.assign(base,{allDay:true,startTime:it.date+'T00:00:00+09:00',endTime:dadd(it.date,1)+'T00:00:00+09:00'});
}
const evIdOf=r=>{let p=r&&r.payload;if(typeof p==='string'){try{p=JSON.parse(p)}catch(_){}}return p&&(p.id||p.eventId||(p.event&&p.event.id))||null};
async function syncGcal(manual){
  if(S.gcalBusy||!S.db||!S.isOwner)return;const mcp=window.claude&&window.claude.use?await window.claude.use('mcp'):null;if(!mcp)return;
  S.gcalBusy=true;S.gcalErr='';render();
  let made=0,changed=0,removed=0;
  const call=(tool,input)=>mcp.callTool('Google Calendar',tool,input,{cache:false});
  try{
    const want={};gcalItems().forEach(it=>{want[it.key]=it});
    const have={};S.gcal.forEach(g=>{have[g.id]=g});
    for(const [key,it] of Object.entries(want)){
      const input=gcalInput(it);const sig=strHash(JSON.stringify(input));const g=have[key];
      if(g&&g.sig===sig)continue;
      let eventId=g&&g.eventId;
      if(eventId){try{await call('update_event',Object.assign({eventId},input));changed++}catch(e){if(e&&e.code==='tool_error')eventId=null;else throw e}}
      if(!eventId){eventId=evIdOf(await call('create_event',input));made++}
      await S.db.collection('gcal').doc(key).set({eventId:eventId||'',sig,date:it.date});
    }
    for(const g of S.gcal){if(want[g.id]||(g.date&&g.date<dadd(TODAY,-1)))continue;
      if(g.eventId){try{await call('delete_event',{eventId:g.eventId,notificationLevel:'NONE'})}catch(e){if(!(e&&e.code==='tool_error'))throw e}}
      await S.db.collection('gcal').doc(g.id).delete();removed++}
    const ms=Object.assign({},mainSettings());delete ms.id;ms.gcal=Object.assign(gcalCfg(),{syncedAt:new Date().toISOString()});
    await S.db.collection('settings').doc('main').set(ms);
    if(manual||made||changed||removed)toast('Googleカレンダーに反映しました（追加'+made+'・更新'+changed+'・削除'+removed+'）');
  }catch(e){
    const c=e&&e.code;
    S.gcalErr=c==='server_not_connected'||c==='needs_reauth'?'Googleカレンダーの接続が必要です（claude.ai の設定 → コネクタ）'
      :c==='not_in_manifest'||c==='consent_required'?'このページでのGoogleカレンダーの利用が許可されていません（ページの権限メニュー）'
      :'Googleカレンダーへの反映が途中で止まりました（'+(c||'error')+'）。「今すぐ反映」でもう一度試してください';
  }finally{S.gcalBusy=false;render()}
}
function gcalPanel(){
  const cfg=gcalCfg();
  if(!S.isOwner)return'<div class="alert-row"><b>Googleカレンダー連携</b><span class="hint">'+(cfg.syncedAt?'オーナーのGoogleカレンダーに反映中（最終 '+dlabel(cfg.syncedAt.slice(0,10))+'）':'オーナーが設定すると、撮影などの予定がGoogleカレンダーに自動で入ります')+'</span></div>';

    +'<span class="hint">'+(S.gcalBusy?'反映しています…':cfg.syncedAt?'最終反映 '+dlabel(cfg.syncedAt.slice(0,10))+' '+new Date(cfg.syncedAt).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}):'まだ反映していません')+'</span>'
    +(S.gcalErr?'<span class="chip bad" style="white-space:normal">'+esc(S.gcalErr)+'</span>':'')
    +'<button class="primary" style="margin-left:auto" data-act="gcalSync"'+(S.gcalBusy?' disabled':'')+'>今すぐ反映</button></div>'
    +'<p class="hint" style="margin:0">チェックした種類の予定（昨日以降のもの）を、あなたのGoogleカレンダーに自動で登録・更新・削除します。撮影予定の保存やスプレッドシートの同期のたびに反映されます。</p>';
}

const company=()=>((S.settings.find(x=>x.id==='main')||{}).company||'');

function pdfPages(cid,m){
  const c=cById(cid),d=metricsFor(cid,m),pm=madd(m,-1),pd=metricsFor(cid,pm);if(!c||!d)return null;
  const pages=[];const issued=dlabel(TODAY);
  const sumF=followersTotal(cid,m),sumPF=followersTotal(cid,pm);
  const tot=(doc,mm,k)=>doc?Object.keys(PLAT).reduce((a,p)=>{const x=platMetrics(doc,p,cid,mm);return a+(x&&isNum(x[k])?x[k]:0)},0):null;
  const V=tot(d,m,'views'),PV=tot(pd,pm,'views'),P=tot(d,m,'posts'),PP=tot(pd,pm,'posts');
  const box=(l,v,pv,o)=>{o=o||{};return'<div class="box'+(o.hl?' hl':'')+'"><span class="l">'+esc(l)+'</span><span class="v">'+(o.signed&&v>0?'+':'')+fmt(v,o.dp)+(o.pct&&isNum(v)?'%':'')+'</span><span class="c">'+deltaHtml(v,pv,{dp:o.dp,pct:o.pct})+'</span><span class="p">前月 '+(isNum(pv)?(o.signed&&pv>0?'+':'')+fmt(pv,o.dp)+(o.pct?'%':''):'—')+'</span></div>'};
  const plats=reportPlats(d);const an=analysis(cid,m);
  pages.push('<div class="band"><div class="k">SNS運用 月次レポート</div><div class="n">'+esc(c.name)+' 様</div><div class="m">'+mlabel(m)+'</div></div><div class="body">'
    +'<h4>今月のサマリー</h4><div class="t4">'+box('フォロワー合計',sumF,sumPF,{hl:1})+box('総再生数',V,PV)+box('投稿本数',P,PP)+box('1本あたり再生',P?V/P:null,PP?PV/PP:null)+'</div>'
    +(()=>{const cr=contractRows(cid,m);return cr.length?'<h4>契約本数との比較</h4><table><thead><tr><th>種類</th><th class="r">契約（月）</th><th class="r">投稿実績</th><th>判定</th></tr></thead><tbody>'+cr.map(r=>{const v=contractVerdict(r);return'<tr><td>'+r.label+'</td><td class="r">'+r.q+'本</td><td class="r"><b>'+(isNum(r.a)?r.a+'本':'—')+'</b></td><td><b class="'+(v.diff>0?'up':v.diff<0?'down':'flat')+'">'+v.txt+'</b></td></tr>'}).join('')+'</tbody></table>':''})()
    +'<h4>媒体別の結果（前月比）</h4><table><thead><tr><th>媒体</th><th class="r">フォロワー</th><th class="r">増減</th><th class="r">再生数</th><th class="r">増減</th><th class="r">投稿</th><th class="r">1本あたり再生</th></tr></thead><tbody>'
    +plats.map(p=>{const x=platMetrics(d,p,cid,m),y=platMetrics(pd,p,cid,pm)||{};return'<tr><td><b style="color:var(--'+p+')">■</b> '+RP[p].name+'</td><td class="r">'+fmt(x.followers)+'</td><td class="r">'+deltaHtml(x.followers,y.followers)+'</td><td class="r">'+fmt(x.views)+'</td><td class="r">'+deltaHtml(x.views,y.views)+'</td><td class="r">'+fmt(x.posts)+'</td><td class="r">'+fmt(x.vpp)+'</td></tr>'}).join('')+'</tbody></table>'
    +'</div>');
  if(an.length||d.note)pages.push('<div class="band" style="padding:22px 48px"><div class="k">SNS運用 月次レポート</div><div class="m">'+esc(c.name)+' 様 ／ '+mlabel(m)+'</div></div><div class="body">'+(an.length?'<h4>今月のポイント</h4><ul class="note" style="margin:0;padding-left:28px">'+an.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul>':'')+(d.note?'<h4>所感・来月の施策</h4><div class="note">'+esc(d.note)+'</div>':'')+'</div>');
  for(const p of plats){
    const def=RP[p],x=platMetrics(d,p,cid,m),y=platMetrics(pd,p,cid,pm)||{};
    const pp=metricsFor(cid,madd(pm,-1));const gain=isNum(x.followers)&&isNum(y.followers)?x.followers-y.followers:null;
    const pb=pp&&pp[baseOf(p)];const gainPrev=(isNum(y.followers)&&pb&&isNum(pb.followers))?y.followers-pb.followers:null;
    const ks=[box(def.fields[0][1],x.followers,y.followers,{hl:1}),isNum(gain)?box('今月の増加数',gain,gainPrev,{hl:1,signed:1}):'']
      .concat(def.fields.slice(1).filter(([k])=>isNum(x[k])).map(([k,l])=>box(l,x[k],y[k],{dp:k==='watchHours'?1:0})))
      .concat([isNum(x.vpp)?box('1本あたり再生',x.vpp,y.vpp,{hl:1}):'',isNum(x.er)?box('エンゲージメント率',x.er,y.er,{dp:2,pct:1}):'']);
    const all=vidsOf(d,p).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    const vtable=(rows,title)=>'<h4>'+title+'</h4><table><thead><tr><th>動画</th><th>投稿日</th><th class="r">再生</th><th class="r">いいね</th><th class="r">コメント</th></tr></thead><tbody>'+rows.map(v=>'<tr><td>'+esc((v.title||'(無題)').slice(0,34))+'</td><td>'+dlabel(v.date)+'</td><td class="r">'+fmt(v.views)+'</td><td class="r">'+fmt(v.likes)+'</td><td class="r">'+fmt(v.comments)+'</td></tr>').join('')+'</tbody></table>';
    // Numbers + chart on one page, the video list on its own page(s), so nothing runs past the A4 edge.
    const head='<div class="phead" style="--pc:var(--'+p+')"><i></i><b>'+def.name+'</b><span>'+esc(c.name)+' 様 ／ '+mlabel(m)+'</span></div>';
    pages.push(head+'<div class="body"><div class="t3">'+ks.join('')+'</div><h4>6ヶ月の推移</h4>'+trendSvg(cid,p,m)+'</div>');
    const PER=24;
    for(let k=0;k<all.length;k+=PER)
      pages.push(head+'<div class="body">'+vtable(all.slice(k,k+PER),'今月投稿した動画（'+all.length+'本）'+(k?'（続き）':''))+'</div>');
  }
  return pages.map((h,i)=>h+'<div class="foot"><span>'+esc(company()||'SNS運用 月次レポート')+'</span><span>発行日 '+issued+' ・ '+(i+1)+' / '+pages.length+'</span></div>');
}
async function pdfBlob(cid,m){
  const pages=pdfPages(cid,m);if(!pages)return null;
  if(!window.jspdf||!window.html2canvas)throw new Error('lib');
  const host=document.createElement('div');host.style.cssText='position:fixed;left:-10000px;top:0';host.innerHTML='<style>'+PDF_CSS+'</style>';document.body.appendChild(host);
  const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4',compress:true});
  try{
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    for(let i=0;i<pages.length;i++){
      const el=document.createElement('div');el.className='pdfp';el.innerHTML=pages[i];host.appendChild(el);
      const cv=await window.html2canvas(el,{scale:2,backgroundColor:'#ffffff',logging:false});
      if(i)doc.addPage();doc.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',0,0,210,297);el.remove();
    }
  }finally{host.remove()}
  return doc.output('blob');
}
const pdfName=(cid,m)=>'SNSレポート_'+cName(cid).replace(/[\\/:*?"<>|]/g,'')+'_'+m.replace('-','年')+'月.pdf';
async function saveFile(filename,data){try{await S.dl.save({filename,data});toast('保存しました')}catch(e){if(!(e&&e.code==='declined'))toast('保存できませんでした（'+(e&&e.code||'error')+'）')}}
async function pdfOne(cid){
  if(!metricsFor(cid,S.month)){toast(mlabel(S.month)+'のデータがまだありません');return}
  toast('PDFを作成中…');let b;
  try{b=await pdfBlob(cid,S.month)}catch(e){toast('PDFを作成できませんでした。ページを開き直してください');return}
  await saveFile(pdfName(cid,S.month),b);
}
async function pdfAll(){
  const m=S.month;const ids=activeClients().filter(c=>metricsFor(c.id,m)).map(c=>c.id);
  if(!ids.length){toast(mlabel(m)+'のデータがあるクライアントがありません');return}
  if(!window.JSZip){toast('ZIPを作れませんでした。ページを開き直してください');return}
  const zip=new window.JSZip();
  try{for(let i=0;i<ids.length;i++){toast('PDFを作成中… '+(i+1)+' / '+ids.length);zip.file(pdfName(ids[i],m),await pdfBlob(ids[i],m))}}
  catch(e){toast('PDFを作成できませんでした。ページを開き直してください');return}
  const skipped=activeClients().length-ids.length;
  await saveFile('SNSレポート_'+m.replace('-','年')+'月_'+ids.length+'社.zip',await zip.generateAsync({type:'blob'}));
  if(skipped)setTimeout(()=>toast('データ未取得の'+skipped+'社は含まれていません'),2700);
}

/* ---------- SNSの数字を今すぐ取得（Claude Code Remote のルーティンを起動） ---------- */
const REFRESH_TRIGGER='trig_018NmnVi9aNz6MDEDbPco6Zf';
const hasUrls=c=>['ig','tt','yt'].some(p=>(c[p]||'').trim());
const RUN_MAX=30*60*1000;
const isRunning=c=>c.fetchStatus==='running'&&Date.now()-new Date(c.fetchRequestedAt||0).getTime()<RUN_MAX;
function fetchChip(c){
  if(isRunning(c))return'<span class="chip warn">取得中…（5〜10分ほど）</span>';
  if(c.fetchStatus==='running')return'<span class="chip bad">取得が終わりませんでした。もう一度「数字を更新」を押してください</span>';
  if(c.fetchStatus==='error')return'<span class="chip bad" title="'+esc(c.fetchError||'')+'">取得に失敗：'+esc((c.fetchError||'').slice(0,40))+'</span>';
  if(c.fetchedAt)return'<span class="chip good">最終取得 '+dlabel(c.fetchedAt.slice(0,10))+' '+new Date(c.fetchedAt).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})+'</span>';
  return'';
}
async function requestFetch(ids,quiet){
  const targets=(ids==='all'?activeClients():ids.map(cById).filter(Boolean)).filter(hasUrls);
  if(!targets.length){if(!quiet)toast('アカウントURLが登録されたクライアントがありません');return}
  if(targets.some(isRunning)){if(!quiet)toast('いま取得中です。終わるまでお待ちください');return}
  const mcp=window.claude&&window.claude.use?await window.claude.use('mcp'):null;
  if(!mcp){toast('この表示では数字の取得を始められません');return}
  const now=new Date().toISOString();
  try{for(const c of targets)await S.db.collection('clients').doc(c.id).update({fetchStatus:'running',fetchRequestedAt:now})}
  catch(e){toast('取得を始める権限がありません');return}
  try{
    await mcp.callTool('Claude Code Remote','fire_trigger',{trigger_id:REFRESH_TRIGGER,text:'clientIds: '+(ids==='all'?'all':targets.map(c=>c.id).join(','))});
    toast(targets.length+'社の数字の取得を始めました。5〜10分ほどで自動で反映されます');
  }catch(e){
    const c=e&&e.code;
    const msg=c==='server_not_connected'||c==='needs_reauth'?'Claude Code Remote の接続が必要です（claude.ai の設定 → コネクタ）'
      :c==='not_in_manifest'||c==='consent_required'?'このページでの実行が許可されていません（ページの権限メニューから許可）'
      :c==='tool_error'?'起動できませんでした（数字の更新はアカウントのオーナーだけが実行できます）'
      :'起動できませんでした（'+(c||'error')+'）';
    for(const t of targets){try{await S.db.collection('clients').doc(t.id).update({fetchStatus:'error',fetchError:msg})}catch(_){}}
    toast(msg);
  }
}

/* ---------- render ---------- */
const VIEWS={dash:viewDash,prod:viewProd,cal:viewCal,ed:viewEd,rep:viewRep,cli:viewCli};
function render(){
  document.getElementById('mlabel').textContent=mlabel(S.month);
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===S.tab)));
  const main=document.getElementById('main');
  if(S.dbState==='none'){main.innerHTML='<div class="notice">この画面ではデータの保存・共有が使えません。claude.ai にサインインした状態で開くと、チーム全員で同じデータを見られます。</div>';return}
  if(S.loaded<7){main.innerHTML='<div class="empty"><b>読み込み中…</b></div>';return}
  main.innerHTML=(S.canWrite===false?'<div class="notice"><b>この画面は閲覧のみです。</b>入力・変更・削除はできません。編集するには、オーナーに「共有」からあなたのメールアドレスを<b>投稿者または編集者</b>として招待してもらってください（招待されたアカウントでclaude.aiにログインして開きます）。</div>':'')+(VIEWS[S.tab]||viewDash)();
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  if(S.calPickOpen&&!e.target.closest('.picker')){S.calPickOpen=false;render()}
  const t=e.target.closest('[data-act],[data-tab]');if(!t)return;
  if(t.dataset.tab){S.tab=t.dataset.tab;try{localStorage.setItem('vh.tab',S.tab)}catch(_){}render();window.scrollTo(0,0);return}
  const a=t.dataset.act,id=t.dataset.id;
  if(a==='ovclose'&&e.target===t){closeModal();return}
  if(t.tagName==='BUTTON')e.preventDefault();
  switch(a){
    case'mprev':S.month=madd(S.month,-1);S.payOpen=null;render();break;
    case'mnext':S.month=madd(S.month,1);S.payOpen=null;render();break;
    case'mnow':S.month=ymOf(TODAY);render();break;
    case'mclose':closeModal();break;
    case'msave':if(modalSave){t.disabled=true;await modalSave();t.disabled=false}break;
    case'mdel':if(t.dataset.armed==='1'){modalDel&&await modalDel()}else{t.dataset.armed='1';t.textContent='もう一度押すと削除';setTimeout(()=>{if(t.isConnected){t.dataset.armed='';t.textContent='削除'}},3500)}break;
    case'addVideo':editVideo();break;
    case'editVideo':editVideo(S.videos.find(v=>v.id===id));break;
    case'addShoot':editShoot();break;
    case'editShoot':editShoot(S.shoots.find(s=>s.id===id));break;
    case'addClient':editClient();break;
    case'editClient':editClient(cById(id));break;
    case'editMetrics':editMetrics(id,S.month);break;
    case'openRep':S.repClient=id;S.tab='rep';try{localStorage.setItem('vh.rep',id);localStorage.setItem('vh.tab','rep')}catch(_){}render();window.scrollTo(0,0);break;
    case'payOpen':{const k=Number(t.dataset.k);S.payOpen=S.payOpen===k?null:k;render();break}
    case'payCsv':payCsv();break;
    case'editQuota':editQuota(id,S.month);break;
    case'calPickAll':S.calClients=[];S.calPickOpen=true;try{localStorage.setItem('vh.cal','[]')}catch(_){}render();break;
    case'calPickToggle':S.calPickOpen=!S.calPickOpen;render();break;
    case'restore':restore(id);{const el=document.querySelector('.toast');if(el)el.hidden=true}break;
    case'gcalSync':syncGcal(true);break;
    case'fetchOne':requestFetch([id]);break;
    case'fetchAll':requestFetch('all');break;
    case'edFilter':S.f.editor=t.dataset.name;S.f.scope='month';S.tab='prod';render();break;
    case'vsort':S.vsort=t.dataset.k;render();break;
    case'pdfOne':pdfOne(id);break;
    case'pdfAll':pdfAll();break;
    case'saveCompany':{const v=document.getElementById('set-company').value.trim();const ms=Object.assign({},mainSettings(),{company:v});delete ms.id;if(await save('settings','main',ms))toast('保存しました');break}
    case'saveSheet':{const v=document.getElementById('set-sheet').value.trim();if(!/[-\w]{25,}/.test(v)){toast('スプレッドシートのURLを貼り付けてください');break}const ms=Object.assign({},mainSettings(),{sheet:v});delete ms.id;if(await save('settings','main',ms)){toast('保存しました。同期します');syncSheet(true)}break}
    case'syncSheet':syncSheet(true);break;
    case'copyRep':{const txt=reportText();if(!txt){toast('先に数値を入力してください');break}
      try{await navigator.clipboard.writeText(txt);toast('LINE・メールに貼れる報告文をコピーしました')}
      catch(_){openModal('報告文',field({k:'txt',label:'全選択してコピーしてください',type:'textarea',v:txt,rows:14}),async()=>closeModal());const ta=document.getElementById('f_txt');ta.focus();ta.select()}
      break}
  }
});
document.addEventListener('change',async e=>{
  const t=e.target;const a=t.dataset&&t.dataset.act;if(!a)return;
  if(a==='filt'){S.f[t.dataset.k]=t.type==='checkbox'?t.checked:t.value;render()}
  else if(a==='calPick'){const sel=new Set(S.calClients||[]);t.checked?sel.add(t.value):sel.delete(t.value);S.calClients=[...sel];S.calPickOpen=true;try{localStorage.setItem('vh.cal',JSON.stringify(S.calClients))}catch(_){}render()}
  else if(a==='gcalType'){const cfg=gcalCfg();cfg.types=Object.assign({},cfg.types,{[t.dataset.k]:t.checked});const ms=Object.assign({},mainSettings(),{gcal:cfg});delete ms.id;if(await save('settings','main',ms))syncGcal(true)}
  else if(a==='payBasis'){S.payBasis=t.value;S.payOpen=null;try{localStorage.setItem('vh.pay',t.value)}catch(_){}render()}
  else if(a==='repClient'){S.repClient=t.value;try{localStorage.setItem('vh.rep',t.value)}catch(_){}render()}
  else if(a==='status'){t.dataset.s=t.value;if(await upd('videos',t.dataset.id,{status:t.value,updatedAt:new Date().toISOString()}))toast('ステータスを「'+t.value+'」にしました')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalSave)closeModal()});

/* ---------- boot ---------- */
render();
(async()=>{
  const db=window.claude&&window.claude.use?await window.claude.use('db'):null;
  if(!db){S.dbState='none';render();return}
  S.db=db;
  const sub=(col,key)=>db.collection(col).onSnapshot(snap=>{S[key]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));if(!S['_'+key]){S['_'+key]=1;S.loaded++;if(S.loaded===7)autoSync()}if(!document.querySelector('.ov'))render()},err=>{toast('データの同期が止まりました。ページを開き直してください')});
  sub('clients','clients');sub('videos','videos');sub('shoots','shoots');sub('metrics','metrics');sub('settings','settings');sub('gcal','gcal');sub('trash','trash');
  async function autoSync(){const at=mainSettings().sheetSyncedAt;if(!at||Date.now()-new Date(at).getTime()>10*60*1000)await syncSheet(false);syncGcal(false);pruneTrash()}
  window.claude.use('user').then(async u=>{S.isOwner=!!(u&&u.isOwner&&u.isOwner());try{S.canWrite=u&&u.can?await u.can('data.write'):null}catch(_){S.canWrite=null}render()});
  window.claude.use('downloads').then(d=>{S.dl=d;if(!document.querySelector('.ov'))render()});
})();
})();
